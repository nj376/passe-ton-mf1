{{- /* Schéma « eau douce, eau de mer » : le même volume immergé, deux poussées. Fiche Théorie, Flottabilité. */ -}}
<figure class="ress-schema">
  <ol class="flot-panneaux">
    <li class="flot-panneau"><svg class="flot-dessin" viewBox="0 0 200 180" role="img" aria-label="Dix litres immergés en eau douce : poussée de 10 kg"><rect class="flot-eau" x="0" y="30" width="200" height="150"></rect><line class="flot-ligne-eau" x1="0" y1="30" x2="200" y2="30"></line><rect class="flot-objet" x="72" y="82" width="56" height="50" rx="6"></rect><text class="flot-txt flot-txt--fort" x="100" y="112" text-anchor="middle">10 L</text><line class="flot-poussee" x1="100.0" y1="82.0" x2="100.0" y2="51.0"></line><polygon class="flot-poussee-tete" points="100.0,40.0 106.0,51.0 94.0,51.0"></polygon></svg><strong class="flot-panneau__titre">En eau douce</strong><span class="flot-panneau__texte">Masse volumique : 1 kg/L. Poussée : 10 × 1 = 10 kg.</span></li>
    <li class="flot-panneau"><svg class="flot-dessin" viewBox="0 0 200 180" role="img" aria-label="Dix litres immergés en mer : poussée d’environ 10,3 kg"><rect class="flot-eau flot-eau--mer" x="0" y="30" width="200" height="150"></rect><line class="flot-ligne-eau" x1="0" y1="30" x2="200" y2="30"></line><rect class="flot-objet" x="72" y="82" width="56" height="50" rx="6"></rect><text class="flot-txt flot-txt--fort" x="100" y="112" text-anchor="middle">10 L</text><line class="flot-poussee" x1="100.0" y1="82.0" x2="100.0" y2="47.0"></line><polygon class="flot-poussee-tete" points="100.0,36.0 106.0,47.0 94.0,47.0"></polygon></svg><strong class="flot-panneau__titre">En eau de mer</strong><span class="flot-panneau__texte">Masse volumique : environ 1,03 kg/L. Poussée : 10 × 1,03 = 10,3 kg.</span></li>
  </ol>
  
  <figcaption>Même volume, liquide plus dense, poussée plus forte : on est mieux porté en mer, il faut donc un peu plus de lest.</figcaption>
</figure>
