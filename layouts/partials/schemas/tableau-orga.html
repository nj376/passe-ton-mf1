{{- /* Schéma « tableau de l’organisationnelle » : une façon de répartir le tableau en zones avant d’écrire. */ -}}
<figure class="ress-schema">
  <div class="schema-tableau" role="list" aria-label="Zones du tableau">
    <div class="schema-tableau__zone schema-tableau__zone--titre" role="listitem"><strong>Titre</strong><span>Le sujet en une ligne, le type de sujet</span></div>
    <div class="schema-tableau__zone schema-tableau__zone--humains" role="listitem"><strong>Qui</strong><span>Encadrants et plongeurs : niveaux, aptitudes, nombre</span></div>
    <div class="schema-tableau__zone schema-tableau__zone--site" role="listitem"><strong>Où</strong><span>Plan du site : zones d’évolution, mouillage, mise à l’eau, dangers</span></div>
    <div class="schema-tableau__zone schema-tableau__zone--planning" role="listitem"><strong>Quand</strong><span>Planning : rotations, horaires, intervalles</span></div>
    <div class="schema-tableau__zone schema-tableau__zone--palanquees" role="listitem"><strong>Comment</strong><span>Palanquées, paramètres, fiche de sécurité ; objectifs et progression si c’est une formation</span></div>
    <div class="schema-tableau__zone schema-tableau__zone--securite" role="listitem"><strong>Avec quoi</strong><span>Sécurité générale, du site, du plongeur ; matériel de secours ; logistique</span></div>
  </div>
  <figcaption>Décide de la place de chaque zone avant d’écrire, et garde un code couleur (par exemple rouge pour la sécurité) du début à la fin.</figcaption>
</figure>
