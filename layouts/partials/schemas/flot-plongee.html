{{- /* Schéma « ce qui fait varier la flottabilité pendant une plongée » : surface, fond, palier. Fiche Théorie, Flottabilité. */ -}}
<figure class="ress-schema">
  <ol class="flot-panneaux">
    <li class="flot-panneau"><svg class="flot-dessin" viewBox="0 0 200 180" role="img" aria-label="Début de plongée : combinaison épaisse, bloc plein"><rect class="flot-eau" x="0" y="40" width="200" height="140"></rect><line class="flot-ligne-eau" x1="0" y1="40" x2="200" y2="40"></line><rect class="flot-bloc" x="91" y="66" width="18" height="46" rx="8"></rect><rect class="flot-combi" x="84" y="74" width="32" height="40" rx="10"></rect><circle class="flot-tete" cx="100" cy="62" r="10"></circle><text class="flot-txt flot-txt--doux" x="100" y="165" text-anchor="middle">surface</text></svg><strong class="flot-panneau__titre">Au départ</strong><span class="flot-panneau__texte">Combinaison épaisse, bloc plein : tu descends grâce au lest, gilet vide.</span></li>
    <li class="flot-panneau"><svg class="flot-dessin" viewBox="0 0 200 180" role="img" aria-label="Au fond : la combinaison s’écrase, la flottabilité diminue"><rect class="flot-eau" x="0" y="10" width="200" height="170"></rect><line class="flot-ligne-eau" x1="0" y1="10" x2="200" y2="10"></line><rect class="flot-bloc" x="91" y="71" width="18" height="46" rx="8"></rect><rect class="flot-combi flot-combi--ecrasee" x="89" y="79" width="22" height="40" rx="10"></rect><circle class="flot-tete" cx="100" cy="67" r="10"></circle><line class="flot-poids" x1="150.0" y1="70.0" x2="150.0" y2="109.0"></line><polygon class="flot-poids-tete" points="150.0,120.0 144.0,109.0 156.0,109.0"></polygon><text class="flot-txt flot-txt--doux" x="100" y="165" text-anchor="middle">au fond</text></svg><strong class="flot-panneau__titre">Au fond</strong><span class="flot-panneau__texte">La pression écrase les bulles du néoprène : le volume diminue, la poussée aussi. Tu compenses au gilet.</span></li>
    <li class="flot-panneau"><svg class="flot-dessin" viewBox="0 0 200 180" role="img" aria-label="Au palier : le bloc s’est allégé, la flottabilité augmente"><rect class="flot-eau" x="0" y="40" width="200" height="140"></rect><line class="flot-ligne-eau" x1="0" y1="40" x2="200" y2="40"></line><rect class="flot-bloc flot-bloc--vide" x="91" y="71" width="18" height="46" rx="8"></rect><rect class="flot-combi" x="84" y="79" width="32" height="40" rx="10"></rect><circle class="flot-tete" cx="100" cy="67" r="10"></circle><line class="flot-poussee" x1="150.0" y1="130.0" x2="150.0" y2="91.0"></line><polygon class="flot-poussee-tete" points="150.0,80.0 156.0,91.0 144.0,91.0"></polygon><text class="flot-txt flot-txt--doux" x="100" y="165" text-anchor="middle">palier à 3 m</text></svg><strong class="flot-panneau__titre">Au palier</strong><span class="flot-panneau__texte">L’air consommé a allégé le bloc : c’est là, bloc presque vide, qu’on vérifie son lestage.</span></li>
  </ol>
  
  <figcaption>Trois effets à connaître : la combinaison qui s’écrase (Mariotte), le bloc qui s’allège, et le milieu (eau douce ou de mer).</figcaption>
</figure>
