{{- /* Schéma « localisation » : à l’air, une oreille reçoit le son avant l’autre ; sous l’eau, il semble venir de partout. Fiche Théorie, Acoustique. */ -}}
<figure class="ress-schema">
  <ol class="flot-panneaux">
    <li class="flot-panneau"><svg class="flot-dessin" viewBox="0 0 200 180" role="img" aria-label="À l’air : le son arrive d’abord à l’oreille la plus proche, puis à l’autre"><rect class="aco-air" x="0" y="0" width="200" height="180"></rect><circle class="aco-onde" cx="30" cy="90" r="10"></circle><circle class="aco-onde" cx="30" cy="90" r="28"></circle><circle class="aco-onde" cx="30" cy="90" r="46"></circle><circle class="aco-onde" cx="30" cy="90" r="64"></circle><circle class="flot-tete" cx="125" cy="90" r="22"></circle><ellipse class="aco-oreille" cx="103" cy="90" rx="5" ry="9"></ellipse><ellipse class="aco-oreille" cx="147" cy="90" rx="5" ry="9"></ellipse><text class="flot-txt flot-txt--fort" x="103" y="130" text-anchor="middle">1</text><text class="flot-txt flot-txt--fort" x="147" y="130" text-anchor="middle">2</text></svg><strong class="flot-panneau__titre">À l’air libre</strong><span class="flot-panneau__texte">Le son touche une oreille un court instant avant l’autre : le cerveau en déduit sa direction.</span></li>

  </ol>
  <figcaption>On entend le bateau, parfois très bien, mais on ne sait ni où il est ni s’il approche.</figcaption>
</figure>
