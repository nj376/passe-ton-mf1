le class="ana-pastille" cx="150" cy="248" r="10" stroke-width="1.2"></circle><text class="ana-pastille-num ana-pastille-num--xs" x="150" y="251.8" text-anchor="middle">5</text><circle class="ana-pastille" cx="250" cy="30" r="10" stroke-width="1.2"></circle><text class="ana-pastille-num ana-pastille-num--xs" x="250" y="33.8" text-anchor="middle">6</text></svg><div class="ana-legende"><div class="ana-legende__groupe"><ol class="ana-legende__liste"><li value="1">Bronchiole terminale, qui amène l’air</li><li value="2">Sac alvéolaire : une grappe d’alvéoles</li><li value="3">Alvéole ouverte : l’air y arrive et en repart</li></ol></div><div class="ana-legende__groupe"><ol class="ana-legende__liste"><li value="4">Réseau de capillaires collé aux alvéoles : c’est là que se font les échanges</li><li value="5">Vaisseau qui amène le sang pauvre en oxygène (en bleu)</li><li value="6">Vaisseau qui repart avec le sang chargé en oxygène (en rouge)</li></ol></div></div><figcaption>Entre l’air de l’alvéole et le sang du capillaire, il n’y a qu’une paroi extrêmement fine, la paroi alvéolo-capillaire. C’est ce qui rend les échanges si efficaces, et c’est aussi ce qui la rend si fragile quand l’alvéole se distend.</figcaption><p class="ana-credit">Adapté de « <a href="https://commons.wikimedia.org/wiki/File:Alveolus_diagram.svg" rel="noopener">Alveolus diagram</a> », LadyofHats, Wikimedia Commons, domaine public. Modifications : couleurs, légendes numérotées en français, étiquettes retirées.</p></figure>
