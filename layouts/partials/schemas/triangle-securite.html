{{- /* Schéma « triangle de la sécurité » : humain, matériel, milieu, la sécurité au centre (support de stage initial). */ -}}
<figure class="ress-schema">
  <div class="schema-triangle">
    <svg class="schema-triangle__svg" viewBox="0 0 260 200" aria-hidden="true">
      <polygon points="130,22 238,182 22,182" class="schema-triangle__forme"></polygon>
      <text x="130" y="128" text-anchor="middle" class="schema-triangle__centre">Sécurité</text>
      <text x="130" y="14" text-anchor="middle" class="schema-triangle__sommet">Humain</text>
      <text x="16" y="198" class="schema-triangle__sommet">Matériel</text>
      <text x="244" y="198" text-anchor="end" class="schema-triangle__sommet">Milieu</text>
    </svg>
    <dl class="schema-triangle__liste">
      <div><dt>Humain</dt><dd>Les encadrants (nombre, niveau), les plongeurs ou élèves (niveau, nombre, place dans la formation), les palanquées et la fiche de sécurité.</dd></div>
      <div><dt>Matériel</dt><dd>Blocs, combinaisons, lestage, matériel de secours et d’assistance, documents administratifs.</dd></div>
      <div><dt>Milieu</dt><dd>Artificiel ou naturel, mer ou lac, structure d’accueil, choix du site et ses raisons, conditions du jour (météo marine).</dd></div>
    </dl>
  </div>
  <figcaption>La sécurité tient sur trois appuis : si l’un manque, elle tombe. Passe chacun en revue avant de présenter ton organisation.</figcaption>
</figure>
