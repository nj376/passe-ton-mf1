{{- /* Les quatre états de saturation, série de panneaux dessinée en SVG. Écrit 4, fiche Le modèle de Haldane et ses dérivés. Généré par gen_des_haldane.py. */ -}}
<figure class="ress-schema"><ol class="flot-panneaux"><li class="flot-panneau"><svg class="flot-dessin" viewBox="0 0 260 200" role="img" aria-label="Sous-saturation : la pression partielle d’azote respirée dépasse la tension du tissu, l’azote entre dans le tissu"><rect class="aco-air" x="0" y="0" width="260" height="200"></rect><path class="pp-axe ana-sans-fond" d="M30 170 H230"></path><rect class="des-barre-pp" x="55" y="60" width="50" height="110" rx="3"></rect><rect class="ana-liquide-fonce" x="155" y="120" width="50" height="50" rx="3"></rect><text class="flot-txt flot-txt--doux" x="80" y="188" text-anchor="middle">air respiré</text><text class="flot-txt flot-txt--doux" x="180" y="188" text-anchor="middle">tissu</text><path class="ana-trajet" d="M110 40 L142 40"></path><path class="ana-trajet-tete" d="M150 40 L142 35.2 L142 44.8 Z"></path><text class="flot-txt flot-txt--doux" x="130" y="28" text-anchor="middle">l’azote entre</text></svg><strong class="flot-panneau__titre">Sous-saturation</strong><span class="flot-panneau__texte">À la descente et au fond : on respire plus d’azote que le tissu n’en contient. Il se charge.</span></li><li class="flot-panneau"><svg class="flot-dessin" viewBox="0 0 260 200" role="img" aria-label="Saturation : la tension du tissu égale la pression partielle d’azote respirée, il n’y a plus d’échange net"><rect class="aco-air" x="0" y="0" width="260" height="200"></rect><path class="pp-axe ana-sans-fond" d="M30 170 H230"></path><rect class="des-barre-pp" x="55" y="90" width="50" height="80" rx="3"></rect><rect class="ana-liquide-fonce" x="155" y="90" width="50" height="80" rx="3"></rect><text class="flot-txt flot-txt--doux" x="80" y="188" text-anchor="middle">air respiré</text><text class="flot-txt flot-txt--doux" x="180" y="188" text-anchor="middle">tissu</text><text class="flot-txt flot-txt--doux" x="130" y="40" text-anchor="middle">équilibre</text></svg><strong class="flot-panneau__titre">Saturation</strong><span class="flot-panneau__texte">Tension et pression partielle sont égales : plus d’échange net. C’est l’état normal en surface.</span></li><li class="flot-panneau"><svg class="flot-dessin" viewBox="0 0 260 200" role="img" aria-label="Sursaturation : à la remontée, la tension du tissu dépasse la pression partielle respirée, l’azote sort et s’élimine par la respiration"><rect class="aco-air" x="0" y="0" width="260" height="200"></rect><path class="pp-axe ana-sans-fond" d="M30 170 H230"></path><rect class="des-barre-pp" x="55" y="120" width="50" height="50" rx="3"></rect><rect class="ana-liquide-fonce" x="155" y="90" width="50" height="80" rx="3"></rect><text class="flot-txt flot-txt--doux" x="80" y="188" text-anchor="middle">air respiré</text><text class="flot-txt flot-txt--doux" x="180" y="188" text-anchor="middle">tissu</text><path class="ana-trajet" d="M150 40 L118 40"></path><path class="ana-trajet-tete" d="M110 40 L118 44.8 L118 35.2 Z"></path><text class="flot-txt flot-txt--doux" x="130" y="28" text-anchor="middle">l’azote sort</text></svg><strong class="flot-panneau__titre">Sursaturation</strong><span class="flot-panneau__texte">À la remontée : le tissu contient plus d’azote que l’air respiré. Il se décharge par les poumons.</span></li><li class="flot-panneau"><svg class="flot-dessin" viewBox="0 0 260 200" role="img" aria-label="Sursaturation critique : l’écart est trop grand, l’azote ne peut plus s’éliminer à temps et repasse en partie sous forme de bulles"><rect class="aco-air" x="0" y="0" width="260" height="200"></rect><path class="pp-axe ana-sans-fond" d="M30 170 H230"></path><rect class="des-barre-pp" x="55" y="150" width="50" height="20" rx="3"></rect><rect class="ana-liquide-fonce" x="155" y="50" width="50" height="120" rx="3"></rect><text class="flot-txt flot-txt--doux" x="80" y="188" text-anchor="middle">air respiré</text><text class="flot-txt flot-txt--doux" x="180" y="188" text-anchor="middle">tissu</text><path class="ana-trajet" d="M150 40 L118 40"></path><path class="ana-trajet-tete" d="M110 40 L118 44.8 L118 35.2 Z"></path><text class="flot-txt flot-txt--doux" x="130" y="28" text-anchor="middle">l’azote sort</text><circle class="ana-bulle" cx="170" cy="80" r="6"></circle><circle class="ana-bulle" cx="190" cy="100" r="4"></circle><circle class="ana-bulle" cx="176" cy="120" r="5"></circle><circle class="ana-bulle" cx="194" cy="70" r="3"></circle><circle class="ana-bulle" cx="168" cy="146" r="4"></circle></svg><strong class="flot-panneau__titre">Sursaturation critique</strong><span class="flot-panneau__texte">L’écart est trop grand : l’azote n’a plus le temps de partir par les poumons, des bulles se forment.</span></li></ol><p class="flot-legende"><span class="des-legende__pp">pression partielle d’azote de l’air respiré</span><span class="des-legende__tension">tension d’azote dans le tissu</span></p><figcaption>Les modèles de décompression ont un seul but : laisser le tissu en sursaturation pendant la remontée, mais jamais en sursaturation critique.</figcaption></figure>
