<dialog tabindex="-1" class="fenetre fenetre--petite" id="fenetre-remise-a-zero" role="alertdialog" aria-labelledby="reset-titre" aria-describedby="reset-texte">
  <h2 id="reset-titre" class="fenetre__titre fenetre__titre--petit">Remettre ton suivi à zéro ?</h2>
  <p id="reset-texte" class="fenetre__texte">Tes thèmes, tes cartes, tes réponses au Code du sport, tes temps de recherche, ta progression et ta date d’examen seront effacés de ce navigateur. Impossible de revenir en arrière.</p>
  <div class="fenetre__actions">
    <button type="button" class="bouton bouton--secondaire" data-fermer>Annuler</button>
    <button type="button" class="bouton bouton--danger" data-remise-a-zero>Tout remettre à zéro</button>
  </div>
</dialog>
