  chapitre: "Randosub"
  # Pas de MFT : la source est une fiche de préconisations fédérales.
  sourceBureau: "D’après la fiche conseil n°4 Randosub, version consultée en"
  sourceMobile: "Fiche conseil n°4, consultée en"
  arrivee: "Ce que dit la fiche conseil"
