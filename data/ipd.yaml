# Contenu de la page « IPD à 25 m » (textes de la maquette validée).
# Grille : document de formation, hors MFT (_MFT/Profil-IPD-MF1.pdf).

deroulement:
  - bureau: "L’examinateur est conscient et stabilisé à 25 m, au-dessus d’un fond plus important."
    mobile: "Examinateur conscient et stabilisé à 25 m, au-dessus d’un fond plus important."
  - bureau: "Sur son signe, tu le remontes jusqu’à la zone 8-6 m, en privilégiant le gilet."
    mobile: "Sur son signe, remontée jusqu’à la zone 8-6 m, gilet en priorité."
  - bureau: "Tu maîtrises la vitesse en toutes circonstances : une remontée rapide est tolérée au départ, elle doit être maîtrisée au plus tard à 20 m."
    mobile: "Vitesse maîtrisée au plus tard à 20 m."
  - bureau: "Tu t’adaptes si la situation évolue : perte de conscience, lâcher de détendeur, panne d’air."
    mobile: "Adaptation si la situation évolue."
  - bureau: "Arrêt franc entre 8 et 6 m, tour d’horizon en gardant ton niveau."
    mobile: "Arrêt franc entre 8 et 6 m, tour d’horizon."
  - bureau: "Au signe « fin d’exercice », le binôme se sépare et tu déploies ton parachute sans quitter ta profondeur."
    mobile: "Fin d’exercice : séparation et parachute sans quitter sa profondeur."

eliminatoire:
  - bureau: "Tout comportement qui met en jeu la sécurité"
  - bureau: "Un manque de réactivité au fond"
  - bureau: "Une redescente de plus de 2 m, au fond, à la remontée ou au palier"
    mobile: "Une redescente de plus de 2 m"
  - bureau: "Percer la surface sans marquer l’arrêt au palier"

tranches: ["0 à 4", "5 à 9", "10 à 14", "15 à 20"]

criteres:
  - nom: "Qualité et efficacité de la prise en charge"
    notes: ["Aucune réactivité, ou plus de 5 s", "Réactivité un peu longue ou brutale. Prise en charge anarchique", "Bonne réactivité. Prise en charge pas toujours optimale", "Efficace dans l’instant. Prise en charge optimale"]
  - nom: "Contrôle de la vitesse de remontée"
    notes: ["Temps < 50 s ou > 2'30. Aucun contrôle", "Temps < 1' ou > 2'15. Contrôle partiellement maîtrisé", "Temps < 1'25 ou > 2'10. Contrôle relativement maîtrisé", "Temps entre 1'45 et 2'00. Vitesse dégressive et maîtrisée, contrôle anticipé"]
  - nom: "Profil de la remontée"
    profil: true
    notes: ["Trop rapide ou trop lent", "Chaotique", "1 ou 2 arrêts ou ralentissements", "Maîtrisé"]
  - nom: "Adaptation à la situation qui évolue"
    notes: ["Aucune", "Chaotique", "Correcte mais pas optimale", "Efficace, appropriée, anticipée"]
  - nom: "Moyen de remontée"
    notes: ["Palmage propulseur. Gilet inutilisé", "Palmage sporadique. Gilet gonflé puis dégonflé", "Palmage d’équilibre. Gilet majoritaire, un seul regonflage", "Sans palmage. Gilet utilisé de façon optimale"]
  - nom: "Palier"
    notes: ["Non marqué", "En tire-bouchon, sans percer", "Arrêt avec une variation de ±1 m", "Arrêt et tour d’horizon sans variation de profondeur"]
  - nom: "Tractage"
    notes: ["Inefficace. Pas de signe de détresse", "Inconfortable", "Correct mais peu confortable", "Efficace et confortable"]
