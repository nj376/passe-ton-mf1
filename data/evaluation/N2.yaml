        - "Il connaît son ordinateur mais le regarde peu : on travaille l'étape 3, « Contrôler à la bonne fréquence »."
        - "Il le consulte bien : on passe aux étapes 4 et 5, communication au GP et restitution au DP."
    bilan:
      situation: "l'étape 6 : tout au long de la formation, principes de la table vérifiés à l'oral ou à l'écrit, sans calcul"
