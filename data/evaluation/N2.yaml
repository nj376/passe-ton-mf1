        - "A-t-il des idées fausses ? Par exemple : « en autonomie, chacun suit son ordinateur », ou « on peut s'attacher au parachute pour ne pas le perdre »."
        - "Sait-il ce qu'est une règle commune quand les ordinateurs sont différents ?"
      esprit:
        - "Est-il pressé de plonger sans moniteur, ou inquiet de devoir tout gérer ?"
        - "Mesure-t-il la responsabilité qu'il prend envers ses équipiers ?"
      comment: "Au sec, devant son ordinateur, lui demander : « Montre-moi tout ce qu'il t'indique. » Puis : « Vous êtes trois avec des ordinateurs différents : comment remontez-vous ? » On écoute ses réponses sans corriger."
      adapter:
        - "Il lit mal son ordinateur : on commence à l'étape 1, « Lire son ordinateur »."
        - "Il le lit mais ne pense pas à la palanquée : on passe à l'étape 2, « Plusieurs moyens de désaturation, table fédérale »."
        - "Il connaît la théorie : on passe à l'étape 3, « Communiquer et se surveiller », moniteur en retrait."
        - "Il n'a jamais lancé de parachute : on prévoit l'étape 5 à faible profondeur, moniteur à côté."
    bilan:
