# Cartes « Évaluer l'élève » (début) et « Bilan » (fin) des techniques du N2.
# Proposition de stagiaire (hors MFT). Rangées par identifiant de compétence, puis nom exact de la technique
# (tel qu'il figure dans data/progressions/progressions_N2.json). Les fichiers de progression ne sont pas modifiés.
#
# evaluer.question : la question directrice
# evaluer.vecu / sait / esprit : son vécu, ce qu'il sait ou croit savoir, son état d'esprit (listes)
# evaluer.comment : comment le savoir (situation d'observation)
# evaluer.adapter : où commencer selon ce qu'on a observé (liste)
# bilan.situation : la situation finale sur laquelle porte le bilan
# bilan.criteres : critères de la situation finale (liste)
# bilan.securite : points de sécurité sans compromis (liste, éventuellement vide)
# bilan.eca : exemple de note « à retravailler → étape à reprendre »
# Les curseurs, le rappel A / ECA / NT et le lien vers la compétence sont ajoutés par les gabarits.


N2-equiper:
  "Gréage et dégréage":
    evaluer:
      question: "Quelles habitudes l'élève a-t-il prises en gréant son scaphandre depuis son N1 ?"
      vecu:
        - "Combien de plongées a-t-il faites depuis son N1 ? Grée-t-il seul, ou un encadrant vérifie-t-il toujours derrière lui ?"
        - "A-t-il déjà gréé sur un bateau qui bouge, avec peu de place, ou seulement au bord ?"
        - "A-t-il déjà utilisé du matériel de location ou un matériel inconnu ?"
      sait:
        - "Sait-il choisir son bloc et sa protection thermique selon la plongée prévue, ou prend-il toujours la même chose ?"
        - "A-t-il des idées fausses ? Par exemple : « si le moniteur a regardé, c'est bon », ou « le matériel des autres, ce n'est pas mon affaire »."
        - "Sait-il qu'un matériel mal réglé ou mal adapté peut favoriser l'essoufflement ?"
      esprit:
        - "Est-il prêt à se passer du contrôle de l'encadrant, ou attend-il encore qu'on vérifie pour lui ?"
        - "A-t-il pris de l'assurance au point d'aller trop vite et de sauter des vérifications ?"
      comment: "C'est le bilan des acquis de l'étape 1 : à la première sortie, il grée et dégrée seul, on observe sans rien dire. On lui demande ensuite : « Qu'est-ce que tu as vérifié, et pourquoi as-tu pris ce matériel ? » On note aussi s'il jette un œil au matériel de ses voisins."
      adapter:
        - "Il oublie une vérification ou fait une erreur : on reprend la progression N1 avant d'aller plus loin, comme le prévoit l'étape 1."
        - "Il grée sans erreur mais prend toujours le même matériel : on passe à l'étape 2, « Choisir le matériel adapté à la plongée »."
        - "Il cherche son inflateur ou son octopus des yeux : on insiste sur l'étape 3, « Réglages corrects en surface »."
        - "Il est déjà sûr et bien réglé : on passe à l'étape 4, « Attention au matériel des équipiers », puis à l'étape 5."
    bilan:
      situation: "l'étape 6 : contrôle continu sur plusieurs sorties, sites et conditions différents"
      criteres:
        - "Il est autonome dans la gestion de son matériel, choisi et réglé pour la plongée prévue."
        - "Il est attentif au matériel de ses équipiers et signale un oubli sans attendre."
        - "Il est prêt dans le temps donné, sans gêner, et rince et range sans rappel."
      securite:
        - "La bouteille est toujours debout et calée, y compris dans le rack sur le bateau, même pressé."
        - "Le robinet est ouvert lentement, manomètre détourné."
      eca: "voit le direct system débranché d'un équipier sans le lui dire → reprendre l'étape 4"
  "Capelage et décapelage":
    evaluer:
      question: "Comment l'élève capelle-t-il et choisit-il son lest depuis son N1 ?"
      vecu:
        - "Combien de plongées a-t-il faites depuis son N1, du bord et sur bateau ?"
        - "A-t-il déjà décapelé et recapelé en surface avec du clapot, ou seulement en eau calme ?"
        - "Garde-t-il le même lest d'une plongée à l'autre, ou l'a-t-il déjà ajusté ?"
      sait:
        - "Sait-il évaluer son lest au palier, bloc moins rempli, en fin de plongée ?"
        - "A-t-il des idées fausses ? Par exemple : « un peu trop de plombs, ça aide à descendre », ou « je compense avec le gilet, peu importe le lest »."
        - "Sait-il ce qu'il faut regarder sur un équipier avant la mise à l'eau ?"
      esprit:
        - "Est-il à l'aise avec son bloc dans l'eau, ou appréhende-t-il le décapelage avec du clapot ?"
        - "Se sent-il pressé par le temps sur le bateau, au risque d'oublier quelque chose ?"
      comment: "C'est le bilan des acquis de l'étape 1 : en milieu naturel, conditions calmes, il capelle au sec, décapelle et recapelle en surface. On lui demande aussi : « Combien de lest as-tu pris, et comment le sais-tu ? » Au palier de la première plongée, on regarde s'il tient sa profondeur sans effort."
      adapter:
        - "Le capelage N1 n'est pas sûr, lest pas largable : on reste à l'étape 1 et on reprend la progression N1."
        - "Il capelle bien mais son lest est approximatif : on passe à l'étape 2, « Lestage adapté à la profondeur »."
        - "Il est lent ou change d'ordre à chaque fois : on travaille l'étape 3, « Capelage rapide et efficace »."
        - "Il est à l'aise en eau calme mais redoute le clapot : on prend le temps à l'étape 4, « Dans l'eau, en conditions variées », moniteur à proximité."
    bilan:
      situation: "l'étape 6 : contrôle continu sur plusieurs sorties, bord et embarcations, conditions variées"
      criteres:
        - "Il est autonome et rapide, prêt dans le temps donné, sans rien oublier."
        - "Son lest est adapté : pas de surlestage ni de sous-lestage."
        - "Il est attentif à ses équipiers, aide à capeler et se laisse aider."
      securite:
        - "Le lest est toujours largable."
        - "Sur bateau, on capelle assis et on ne se déplace pas bloc sur le dos sans y être invité."
        - "Gilet gonflé avant de décapeler dans l'eau, moniteur à proximité."
      eca: "a besoin de son gilet très gonflé au fond → reprendre l'étape 2"
  "Saut droit et bascule arrière, remontée à l'échelle":
    evaluer:
      question: "De quels contextes de mise à l'eau et de sortie l'élève a-t-il l'expérience depuis son N1 ?"
      vecu:
        - "Depuis quelles embarcations a-t-il déjà plongé : pneumatique, bateau ponté, barge ? Et du bord ?"
        - "A-t-il déjà remonté une échelle avec son bloc, ou a-t-il toujours été aidé ?"
        - "A-t-il vécu une mise à l'eau difficile (clapot, courant, regroupement long) ?"
      sait:
        - "Sait-il dire quelle technique convient à quelle embarcation, et pourquoi ?"
        - "A-t-il des idées fausses ? Par exemple : « je saute comme je préfère », ou « j'attends au pied de l'échelle que le précédent ait fini »."
        - "Sait-il où se placer et que faire de ses palmes pour remonter à l'échelle ?"
      esprit:
        - "Est-il serein lors des mises à l'eau, ou stressé par le mouvement et le regard des autres ?"
        - "Pense-t-il à ses équipiers, ou seulement à sa propre mise à l'eau ?"
      comment: "C'est le bilan des acquis de l'étape 1 : embarcation connue, mer calme, mise à l'eau selon la consigne du DP et sortie habituelle. Avant, on lui demande : « Comment vas-tu te mettre à l'eau, et comment comptes-tu remonter ? » On regarde où il se place à la sortie."
      adapter:
        - "Saut ou bascule pas encore sûrs : on reste à l'étape 1 et on reprend la progression N1."
        - "Il maîtrise une seule technique ou ne sait pas choisir : on passe à l'étape 2, « Choisir la technique selon le lieu »."
        - "Il n'a jamais remonté à l'échelle seul : on travaille l'étape 3, « Remontée à l'échelle »."
        - "Il est à l'aise depuis le bateau : on passe à l'étape 4, « Lieux variés », puis aux étapes 5 et 6."
    bilan:
      situation: "l'étape 7 : contrôle continu sur plusieurs sorties, du bord et d'embarcations, dans des milieux naturels variés"
      criteres:
        - "Les techniques usuelles sont maîtrisées avec rapidité et aisance."
        - "Les consignes du DP sont respectées."
        - "Il a le souci de la sécurité globale de la palanquée, du départ au retour à bord."
      securite:
        - "Zone d'eau libre vérifiée avant de sauter, puis dégagée aussitôt."
        - "La consigne du DP prime toujours sur la préférence de l'élève."
        - "Jamais sous l'échelle ni sous un plongeur qui monte ; détendeur en bouche ou masque en place près de l'arrière du bateau."
      eca: "attend sous l'échelle pendant qu'un équipier monte → reprendre l'étape 3"

N2-immerger:
  "Canard et phoque":
    evaluer:
      question: "Comment l'élève s'immerge-t-il aujourd'hui, et à quel rythme ?"
      vecu:
        - "Utilise-t-il le canard, le phoque, ou toujours la descente le long du mouillage ?"
        - "A-t-il déjà dû s'immerger vite, avec du clapot ou un léger courant ?"
        - "S'est-il déjà retrouvé seul en surface, ou loin de la palanquée à la descente ?"
      sait:
        - "Sait-il équilibrer ses oreilles dès le départ et s'arrêter à la profondeur visée ?"
        - "A-t-il des idées fausses ? Par exemple : « on a le temps de se préparer en surface », ou « chacun descend à son rythme, on se retrouve au fond »."
        - "Sait-il pourquoi on s'immerge vite quand il y a du courant ?"
      esprit:
        - "Est-il à l'aise pour s'immerger sans repère, ou a-t-il besoin du mouillage ?"
        - "Craint-il pour ses oreilles, au point de s'attarder en surface ?"
      comment: "C'est le bilan des acquis de l'étape 1 : en milieu naturel, eau calme, immersion en canard puis en phoque, en PMT et en scaphandre. On lui demande ensuite : « Laquelle préfères-tu, et quand utiliserais-tu l'autre ? » On regarde le délai avant l'immersion et l'équilibrage."
      adapter:
        - "Une des techniques n'est pas propre ou les oreilles posent problème : on reprend la progression N1."
        - "Les deux techniques sont propres mais lentes : on passe à l'étape 2, « S'immerger rapidement »."
        - "Il s'immerge vite mais seul : on travaille l'étape 3, « S'immerger en palanquée groupée »."
        - "Il est déjà rapide et groupé : on passe à l'étape 4, « Avec du clapot ou un léger courant »."
    bilan:
      situation: "l'étape 5 : toutes conditions de pratique, en contrôle continu"
      criteres:
        - "L'immersion est rapide, oreilles équilibrées."
        - "Il applique la technique demandée."
        - "La cohésion de la palanquée est maintenue."
      securite:
        - "Avec du courant, le DP juge les conditions compatibles et le moniteur se place en aval."
      eca: "file vers le fond sans attendre la palanquée → reprendre l'étape 3"
  "Palmages":
    evaluer:
      question: "Comment l'élève gère-t-il son effort de palmage, en surface comme en immersion ?"
      vecu:
        - "A-t-il déjà nagé sur une longue distance en PMT ou capelé, en mer ?"
        - "S'est-il déjà essoufflé en palmant, par exemple contre un courant ou en revenant au bateau ?"
        - "Pratique-t-il une activité physique régulière ?"
      sait:
        - "Sait-il qu'en profondeur l'effort pèse davantage sur la ventilation ?"
        - "A-t-il des idées fausses ? Par exemple : « contre le courant, il faut palmer plus fort », ou « je m'arrêterai quand je serai fatigué »."
        - "Connaît-il les signes de l'essoufflement et ce qu'il faut faire ?"
      esprit:
        - "Veut-il suivre le rythme des autres, quitte à forcer ?"
        - "Ose-t-il dire qu'il a besoin de s'arrêter ?"
      comment: "C'est le bilan des acquis de l'étape 1 : environ 100 m en PMT et 50 m capelé, puis déplacement en immersion. On regarde l'amplitude du geste, les bras et la ventilation. Au retour, on lui demande : « À quel moment as-tu senti que ça devenait dur ? »"
      adapter:
        - "Le geste se dégrade ou il s'essouffle : on reste à l'étape 1 et on reprend la qualité du palmage."
        - "Le geste est bon en surface mais pas en immersion : on passe à l'étape 2, « Palmage économique en profondeur »."
        - "Il force quand l'effort augmente : on insiste sur l'étape 3, « Gérer l'effort face à un léger courant »."
        - "Il est économe et attentif à sa ventilation : on allonge les distances avec les étapes 4 et 5."
    bilan:
      situation: "l'étape 6 : nages de surface, environ 250 m en PMT et 100 m capelé, sans chronomètre"
      criteres:
        - "Le parcours est réalisé dans de bonnes conditions physiques."
        - "Le geste reste de qualité jusqu'au bout."
        - "Il termine sans essoufflement, avec sa palanquée."
      securite:
        - "Accoutumance progressive à la profondeur ; au-delà de 20 m, sous la responsabilité d'un E3."
        - "Gilet gonflé en surface pendant toute la nage capelé."
      eca: "accélère contre le courant et s'essouffle → reprendre l'étape 3"
  "Remontée en expiration contrôlée REC":
    evaluer:
      question: "Quel souvenir et quelle compréhension l'élève garde-t-il de la REC travaillée au N1 ?"
      vecu:
        - "A-t-il fait des REC depuis son N1, ou seulement à l'examen ?"
        - "Comment l'a-t-il vécue : sereinement, ou avec la peur de manquer d'air ?"
        - "Pense-t-il à expirer lors de ses remontées habituelles ?"
      sait:
        - "Sait-il pourquoi on part sur une inspiration normale, jamais une grande inspiration ?"
        - "A-t-il des idées fausses ? Par exemple : « il faut remonter vite pour ne pas manquer d'air », ou « il faut vider ses poumons avant de partir »."
        - "Sait-il à quoi sert cet exercice en cas de panne d'air ?"
      esprit:
        - "Appréhende-t-il de partir de plus profond qu'au N1 ?"
        - "Est-il confiant au point de vouloir remonter vite ?"
      comment: "C'est le bilan des acquis de l'étape 1 : depuis 6 m maximum, embout en bouche, moniteur au contact. Avant, on lui demande : « Explique-moi comment tu vas faire et pourquoi. » On regarde le départ, le rejet d'air et la vitesse, et on note son état à l'arrivée."
      adapter:
        - "Le rejet d'air n'est pas continu ou il se précipite : on reste à l'étape 1, depuis 6 m maximum."
        - "La REC est correcte mais il prend appui au départ : on passe à l'étape 2, « Départ du fond stabilisé »."
        - "Il part stabilisé et calmement : on passe à l'étape 3, « Augmenter la profondeur », jamais au-delà de 10 m."
        - "Il est inquiet : on garde les profondeurs faibles plus longtemps et on relie l'exercice à l'expiration de toutes ses remontées (étape 5)."
    bilan:
      situation: "l'étape 6 : REC 10 m, trajet vertical n'excédant pas 10 m, départ du fond stabilisé, sur une inspiration normale"
      criteres:
        - "Il remonte sans stress, à vitesse correcte, sans critère de temps."
        - "L'expiration est continue jusqu'à la surface."
        - "L'expiration contrôlée est constatée sur ses autres remontées, sans rappel."
      securite:
        - "Inspiration normale, jamais une grande inspiration."
        - "Jamais au-delà de 10 m."
        - "Le moniteur reste au contact et peut freiner la remontée à tout moment."
      eca: "part en appui sur le fond et accélère en fin de remontée → reprendre l'étape 2"
  "Descente et remontée":
    evaluer:
      question: "Comment l'élève gère-t-il son gilet et sa flottabilité pendant la descente et la remontée ?"
      vecu:
        - "Lors de ses plongées N1, a-t-il déjà touché le fond en arrivant, ou dépassé le palier en remontant ?"
        - "Le guide gérait-il sa flottabilité, ou la gérait-il lui-même ?"
        - "A-t-il déjà fait un palier en pleine eau, sans repère ?"
      sait:
        - "Sait-il pourquoi on injecte un peu d'air en descendant et on purge en remontant ?"
        - "A-t-il des idées fausses ? Par exemple : « on gonfle une fois au fond et c'est réglé », ou « on remonte en palmant, le gilet ne sert qu'en surface »."
        - "Sait-il utiliser son poumon ballast pour affiner son niveau ?"
      esprit:
        - "Est-il inquiet à l'idée de descendre plus profond qu'au N1 ?"
        - "Se repose-t-il sur le guide pour tenir sa profondeur ?"
      comment: "C'est le bilan des acquis de l'étape 1 : équilibre à la demande, en statique et en déplacement. Puis on observe sa première descente et sa première remontée : arrêt au-dessus du fond ou non, purges, vitesse, arrivée au palier. Au débriefing, on lui demande ce qu'il a fait avec son gilet."
      adapter:
        - "Il ne tient pas sa profondeur à plus ou moins 1 m : on reste à l'étape 1."
        - "Il touche le fond ou palme pour se rattraper : on passe à l'étape 2, « Descente équilibrée »."
        - "Il accélère ou dépasse le palier : on travaille l'étape 4, « Remontée équilibrée »."
        - "Descente et remontée sont maîtrisées : on passe à l'étape 3 en profondeur, puis à l'étape 5, « Au palier, en pleine eau »."
    bilan:
      situation: "l'étape 6 : niveau tenu durablement, en contrôle continu"
      criteres:
        - "Le niveau d'immersion est maintenu durablement et sans difficulté."
        - "La vitesse de remontée est régulière, il arrive au palier sans le dépasser."
        - "Le palier en pleine eau est stable."
      securite:
        - "Accoutumance progressive à la profondeur ; au-delà de 20 m, sous la responsabilité d'un E3."
        - "Purger dès que la remontée s'accélère."
      eca: "dépasse le palier en fin de remontée → reprendre l'étape 4"

N2-milieu:
  "Aisance aquatique":
    evaluer:
      question: "Quel regard l'élève porte-t-il sur le milieu, et quel comportement a-t-il pris en plongée ?"
      vecu:
        - "Sur quels sites a-t-il plongé depuis son N1 ? Qu'y a-t-il vu ?"
        - "A-t-il déjà touché le fond, la faune, ou soulevé du sédiment ?"
        - "A-t-il assisté à du nourrissage ou à de la cueillette en plongée ?"
      sait:
        - "Connaît-il le nom des espèces courantes des sites qu'il fréquente ?"
        - "A-t-il des idées fausses ? Par exemple : « donner à manger aux poissons, ça les attire, c'est sympa », ou « une lampe puissante, c'est mieux pour voir »."
        - "Sait-il pourquoi l'éclairage, le bruit et la distance comptent ?"
      esprit:
        - "Est-il curieux du vivant, ou surtout occupé par ses sensations et son matériel ?"
        - "Veut-il approcher les animaux au plus près ?"
      comment: "C'est le bilan des acquis de l'étape 1 : plongée en milieu naturel, près du fond. On regarde contacts, palmage et sédiments. Au débriefing, on lui demande : « Qu'as-tu vu, et peux-tu le nommer ? »"
      adapter:
        - "Il touche le fond ou le vivant : on reste à l'étape 1 et on reprend palmage et stabilisation."
        - "Il est stable mais fait fuir la faune : on passe à l'étape 2, « Être discret »."
        - "Il est discret mais n'ose pas s'approcher : on travaille l'étape 3, « Observer près du vivant »."
        - "Il observe déjà bien : on passe à l'étape 4, « Nommer les espèces courantes »."
    bilan:
      situation: "l'étape 5 : comportement en plongée, en milieu naturel"
      criteres:
        - "Son comportement est respectueux et responsable."
        - "Aucun contact avec le fond ou le vivant, aucun nuage de sédiment."
        - "Il décrit et nomme les espèces fréquentes du site."
      securite: []
      eca: "soulève du sédiment en s'approchant d'une roche → reprendre l'étape 3"

PA20-materiel:
  "Mise en œuvre de son propre matériel":
    evaluer:
      question: "Que sait l'élève de son propre matériel, au-delà de savoir le monter ?"
      vecu:
        - "A-t-il son propre matériel, ou utilise-t-il celui du club ?"
        - "A-t-il déjà changé de bloc ou de combinaison et ajusté son lest en conséquence ?"
        - "A-t-il déjà vécu un incident de matériel, comme un débit continu ?"
      sait:
        - "Sait-il quel matériel est exigé pour plonger en autonomie ?"
        - "A-t-il des idées fausses ? Par exemple : « le détendeur donne de l'air à la pression de la bouteille », ou « le deuxième étage sert de secours au premier »."
        - "Sait-il présenter son matériel à un équipier ?"
      esprit:
        - "S'intéresse-t-il au fonctionnement, ou se contente-t-il que ça marche ?"
        - "Est-il à l'aise pour expliquer à l'oral devant ses équipiers ?"
      comment: "C'est le bilan des acquis de l'étape 1 : sortie en milieu naturel, gréage et vérifications seul. Puis on lui demande : « Montre-moi ton matériel comme si j'étais ton équipier, et explique-moi à quoi sert ton premier étage. » On écoute les mots qu'il emploie."
      adapter:
        - "Il oublie une vérification : on reprend le gréage N1 avant d'aller plus loin."
        - "Il ne sait pas adapter son lest à un changement d'équipement : on passe à l'étape 2, « Adapter son lestage à son équipement »."
        - "Il ignore ce qui est exigé en autonomie : on travaille l'étape 3, « Le matériel obligatoire en autonomie »."
        - "Il connaît son matériel mais pas le principe de détente : on passe à l'étape 4, « Comprendre son détendeur », puis à l'étape 5."
    bilan:
      situation: "l'étape 6 : présenter et expliquer, au fil des sorties et à l'oral sur le détendeur"
      criteres:
        - "Il présente spontanément son matériel à ses équipiers : gilet, détendeur de secours, contrôle de la pression, moyen de désaturation."
        - "Il restitue avec ses mots les principes de détente et d'asservissement."
        - "Il a tout le matériel exigé, sans rappel, avec un lest cohérent."
      securite:
        - "Bouteille debout et calée, robinet ouvert lentement en détournant le manomètre."
      eca: "oublie de présenter son moyen de désaturation → reprendre l'étape 5"
  "Connaissance du matériel des équipiers":
    evaluer:
      question: "L'élève saurait-il se servir du matériel d'un équipier s'il le fallait ?"
      vecu:
        - "A-t-il déjà plongé avec des équipiers équipés différemment de lui ?"
        - "A-t-il déjà manipulé un autre gilet que le sien : lest intégré, purges placées ailleurs ?"
        - "Lui a-t-on déjà présenté du matériel avant une plongée ?"
      sait:
        - "Sait-il repérer le détendeur de secours et la pression d'un équipier ?"
        - "A-t-il des idées fausses ? Par exemple : « tous les gilets marchent pareil », ou « l'ordinateur de mon équipier, c'est son affaire »."
        - "Sait-il lire un ordinateur qui n'est pas le sien ?"
      esprit:
        - "Ose-t-il poser des questions à un équipier sur son matériel ?"
        - "Écoute-t-il vraiment la présentation, ou la considère-t-il comme une formalité ?"
