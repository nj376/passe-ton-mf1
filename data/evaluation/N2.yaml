      criteres:
        - "Vitesse et paliers respectés, parachute mis en place."
        - "Gestion active de la désaturation, matériels différents pris en compte."
        - "Consignes du DP intégrées, au moins un problème de table résolu."
      securite:
        - "Enseignement dans l'espace 0-20 m par un E2 minimum ; le moniteur reste dans la palanquée et reprend la main au besoin."
        - "Jamais attaché au parachute, ligne libre ; il lâche tout s'il se sent entraîné."
      eca: "remonte selon son ordinateur sans tenir compte du plus contraignant → reprendre l'étape 4"

PA20-planifier:
  "Compréhension des directives du DP":
    evaluer:
      question: "Comment l'élève écoute-t-il aujourd'hui le briefing du DP, et qu'en retient-il ?"
      vecu:
        - "Au N1, écoutait-il le briefing, ou laissait-il le guide s'en charger ?"
        - "A-t-il déjà vu un DP modifier les consignes au dernier moment ?"
        - "Se souvient-il des consignes de sa dernière plongée ?"
      sait:
        - "Sait-il ce que fixe le DP : profondeur, durée, pression de fin, paliers, durée totale de remontée ?"
        - "A-t-il des idées fausses ? Par exemple : « si le DP n'a rien dit, on fait comme on veut », ou « on peut dépasser un peu la durée si on a de l'air »."
        - "Sait-il qui décide en cas de doute ?"
      esprit:
        - "Ose-t-il poser une question au DP quand une consigne manque ?"
        - "Voit-il le briefing comme une formalité ou comme le cadre de sa plongée ?"
      comment: "Après un briefing réel du DP, lui demander sans prévenir : « Qu'a dit le DP pour ta palanquée ? » Puis : « Et qu'est-ce qui te manque pour planifier ? » On compare avec ce qui a été réellement annoncé."
      adapter:
        - "Il ne restitue pas durée et profondeur : on commence à l'étape 1, « Restituer les consignes »."
        - "Il restitue mais n'en tire pas de limites : on passe à l'étape 2, « Conditions de fin et règles de désaturation »."
        - "Il ne repère pas ce qui manque : on travaille l'étape 3, « Consignes incomplètes »."
        - "Il intègre déjà le cadre : on passe à l'étape 4, « Cadre modifié »."
    bilan:
      situation: "l'étape 5 : sur cas concret, plongées de formation avec des consignes variées"
      criteres:
        - "Les directives du DP sont comprises et intégrées."
        - "Les limites de la palanquée restent dans le cadre du DP, et il sait d'où vient chaque chiffre."
        - "Il demande l'information manquante et corrige sa planification si le cadre change."
      securite: []
      eca: "garde la profondeur initiale après une réduction du DP → reprendre l'étape 4"
  "Compréhension de la topologie du site de plongée, orientation":
    evaluer:
