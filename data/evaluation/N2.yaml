      vecu:
        - "Au N1, savait-il où il était pendant la plongée, ou suivait-il le guide ?"
        - "A-t-il déjà utilisé un compas, sous l'eau ou en randonnée ?"
        - "A-t-il déjà plongé deux fois sur le même site ?"
