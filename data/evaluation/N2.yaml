        - "Il lit le site mais ne sait pas se servir d'un compas : on passe à l'étape 2, « Le compas au sec »."
        - "Il tient son compas correctement : on passe à l'étape 3, « Suivre un cap en surface », puis à l'étape 4."
        - "Il est déjà à l'aise au compas : on passe à l'étape 6, « Court trajet prédéfini »."
    bilan:
      situation: "l'étape 7 : compas et trajet, plongées de formation sur des sites variés"
      criteres:
        - "Il réussit un aller-retour au compas sur 20 à 30 m."
        - "Il suit un court trajet prédéfini et reconnaît les repères prévus."
        - "Il vérifie régulièrement son compas, tenu dans l'axe du corps."
      securite:
        - "Faible profondeur et bonne visibilité pour les premiers essais, le moniteur reste avec la palanquée."
