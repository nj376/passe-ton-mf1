        - "A-t-il des idées fausses ? Par exemple : « pour revenir, il suffit de faire demi-tour », ou « le compas, on le regarde au départ et c'est tout »."
        - "Sait-il calculer un cap retour ?"
      esprit:
        - "Est-il inquiet à l'idée de devoir retrouver le bateau sans guide ?"
        - "Se croit-il bien orienté alors qu'il ne l'est pas ?"
      comment: "Avant une plongée, lui montrer le croquis du DP et lui demander : « Trace un trajet simple et dis-moi comment tu reviens. » Puis, au sec, lui tendre un compas : « Montre-moi le cap du bateau et le cap retour. » On observe la tenue du compas."
