PA20-assistance:
  "Observation, compréhension et réaction face à un incident":
    evaluer:
      question: "Que ferait l'élève, aujourd'hui, face à un équipier en difficulté ?"
      vecu:
        - "Au N1, a-t-il travaillé l'intervention sur un équipier (passage d'octopus) ?"
        - "A-t-il déjà été témoin d'un incident en plongée : essoufflement, panne d'air, débit continu ?"
        - "A-t-il une formation au secourisme ?"
      sait:
        - "Sait-il reconnaître une ventilation anormale, de l'agitation, une inconscience ?"
        - "A-t-il des idées fausses ? Par exemple : « en cas de problème, on remonte le plus vite possible », ou « c'est au moniteur de gérer »."
        - "Sait-il pourquoi on marque un arrêt avant la surface lors d'une remontée assistée ?"
      esprit:
        - "Se sent-il capable d'intervenir, ou redoute-t-il de mal faire ?"
        - "Risque-t-il d'agir avec brutalité sous l'effet du stress ?"
      comment: "Au sec, le moniteur mime plusieurs situations (signes, ventilation anormale, agitation, débit continu) et lui demande : « Qu'est-ce qui se passe, et que fais-tu ? » On écoute l'analyse et l'ordre des actions, sans corriger."
      adapter:
        - "Il ne reconnaît pas les situations : on commence à l'étape 1, « Interpréter la situation »."
        - "Il les reconnaît mais hésite à agir : on passe à l'étape 2, « Prendre en charge », à faible profondeur."
        - "La prise en charge est sûre : on passe à l'étape 3, « Remontée assistée depuis faible profondeur », puis à l'étape 4."
        - "Il est stressé : on reste plus longtemps aux étapes 1 et 2, situations annoncées."
    bilan:
      situation: "l'étape 7 : validation spécifique en fin de formation, au moins deux situations différentes réalisées chacune intégralement au moins deux fois"
      criteres:
        - "Interprétation juste, prise en charge rapide et efficace."
        - "Remontée régulière à vitesse adaptée, gilets privilégiés, arrêt marqué entre 5 et 3 m."
        - "Sortie d'eau sécurisée, voies aériennes hors de l'eau, relais au DP."
      securite:
        - "L'assisté est le moniteur, qui peut freiner ou interrompre la remontée à tout moment."
        - "Faible profondeur pour les premières prises en charge, puis accoutumance progressive dans l'espace 0-20 m sous la responsabilité d'un E2 minimum."
      eca: "ne marque pas l'arrêt entre 5 et 3 m → reprendre l'étape 3"

PE40-ventiler:
  "Ventilation en surface et en immersion":
    evaluer:
      question: "Comment l'élève gère-t-il sa ventilation depuis son N1, en surface comme à l'effort ?"
      vecu:
        - "A-t-il déjà attendu en surface longtemps, avec du clapot, en ventilant sur le détendeur ou le tuba ?"
        - "S'est-il déjà essoufflé en plongée ? Dans quelles circonstances ?"
        - "A-t-il refait des lâcher-reprise d'embout depuis son N1 ?"
      sait:
        - "Sait-il que l'effort en profondeur favorise l'essoufflement ?"
        - "A-t-il des idées fausses ? Par exemple : « respirer peu, c'est économiser l'air », ou « l'essoufflement passe en accélérant la respiration »."
        - "Sait-il pourquoi on expire à la remontée ?"
      esprit:
        - "Est-il serein en surface, ou pressé de s'immerger ?"
        - "Appréhende-t-il de lâcher son embout plus profond ?"
      comment: "C'est le bilan des acquis de l'étape 1 : milieu naturel, zone 0-6 m. On regarde le rythme de sa ventilation en surface et sous l'eau. Au débriefing, on lui demande : « T'es-tu déjà senti essoufflé ? Qu'as-tu fait ? »"
      adapter:
        - "Les techniques N1 ne sont pas sereines : on reste à l'étape 1."
        - "Il avale de l'eau ou s'agite en surface : on passe à l'étape 2, « Passage embout-tuba », gilet gonflé."
        - "Il est à l'aise en petit fond : on passe à l'étape 3, « Lâcher-reprise en profondeur »."
        - "Il s'essouffle facilement à l'effort : on insiste sur l'étape 4, « Ventilation et effort en profondeur »."
    bilan:
      situation: "l'étape 6 : effort normal à modéré, plongées de formation en conditions réelles"
      criteres:
        - "Sa ventilation est gérée et régulée dans un effort normal à modéré."
        - "Aucun signe d'essoufflement."
        - "L'expiration contrôlée est constatée à chaque remontée, sans rappel."
      securite:
        - "Gilet gonflé avant le passage embout-tuba."
        - "Accoutumance progressive à la profondeur ; au-delà de 20 m, sous la responsabilité d'un E3."
      eca: "s'essouffle après un déplacement en profondeur → reprendre l'étape 4"
  "Vidage du masque":
    evaluer:
      question: "Quel rapport l'élève entretient-il avec le vidage de masque depuis son N1 ?"
      vecu:
        - "A-t-il dû vider son masque en plongée depuis son N1, sans que ce soit un exercice ?"
        - "A-t-il déjà perdu ou pris un coup sur son masque ?"
        - "A-t-il fait les vidages du N1 à genoux sur le fond, ou en pleine eau ?"
      sait:
        - "Sait-il qu'en pleine eau il doit garder son niveau pendant le vidage ?"
        - "A-t-il des idées fausses ? Par exemple : « il faut se poser pour vider son masque », ou « plus profond, c'est plus difficile à vider »."
        - "Sait-il retirer et remettre son masque sans perdre son embout ?"
      esprit:
        - "Est-il gêné par l'eau dans le nez ou les yeux ouverts sous l'eau ?"
        - "Appréhende-t-il de refaire l'exercice plus profond ?"
      comment: "C'est le bilan des acquis de l'étape 1 : zone 0-6 m. On regarde la ventilation, le niveau et l'expression du visage. Après, on lui demande : « Comment tu le vis, sur une échelle de 1 à 10 ? »"
      adapter:
        - "Le vidage N1 est stressant : on reste à l'étape 1 sans augmenter la profondeur."
        - "Le vidage est serein mais il perd son niveau : on passe à l'étape 2, « Vidage stabilisé en pleine eau »."
        - "Il est stable en pleine eau : on passe à l'étape 3, « Vers 20 m », moniteur au contact."
        - "Il est serein à 20 m : on passe à l'étape 4, « Situations variées à 20 m »."
    bilan:
      situation: "l'étape 5 : à 20 m, en situations variées"
      criteres:
        - "Le masque est vidé sans stress."
        - "Ventilation et stabilité sont maintenues."
        - "Il le fait en déplacement, après un effort, et après retrait et remise du masque."
      securite:
        - "Accoutumance progressive à la profondeur, moniteur au contact."
        - "Jamais de situation brutale. Si l'élève stresse, on arrête et on rassure."
      eca: "perd 2 m pendant le vidage en pleine eau → reprendre l'étape 2"
  "Stabilisation":
    evaluer:
      question: "L'élève tient-il son niveau seul, ou compte-t-il sur le fond et sur ses palmes ?"
      vecu:
        - "Au N1, plongeait-il près du fond ou en pleine eau ?"
        - "A-t-il déjà dû lire son ordinateur ou communiquer sans perdre son niveau ?"
        - "Plonge-t-il souvent avec la même combinaison et le même lest ?"
      sait:
        - "Sait-il que son gilet demande des ajustements quand la profondeur change ?"
        - "A-t-il des idées fausses ? Par exemple : « je palme un peu pour rester à niveau, c'est pareil », ou « une fois stable, on ne touche plus au gilet »."
        - "Sait-il se servir de son poumon ballast ?"
      esprit:
        - "Est-il agacé par ses montées et descentes, ou ne les remarque-t-il pas ?"
        - "Est-il crispé, ce qui le fait palmer en permanence ?"
      comment: "C'est le bilan des acquis de l'étape 1 : statique et dynamique, faible profondeur. On lui demande ensuite de lire son ordinateur sans bouger : on regarde s'il palme, s'il s'aide des mains, s'il perd son niveau."
      adapter:
        - "Il ne tient pas l'équilibre à plus ou moins 1 m : on reste à l'étape 1."
        - "Il est stable en petit fond mais pas plus profond : on passe à l'étape 2, « Stabilisation à profondeur croissante »."
        - "Il perd son niveau dès qu'il fait autre chose : on travaille l'étape 3, « Stable pendant une tâche »."
        - "Il est stable mais lent à le devenir : on passe à l'étape 4, « Rapidement, à la demande »."
    bilan:
      situation: "l'étape 5 : toutes situations, au fil des plongées, en lien avec la ventilation et le vidage de masque à 20 m"
      criteres:
        - "La stabilisation est maîtrisée, rapide et efficace."
        - "Le niveau est maintenu pendant une tâche, dont le vidage de masque à 20 m."
        - "Il se stabilise sans palmer."
      securite: []
      eca: "remonte en lisant son ordinateur → reprendre l'étape 3"

