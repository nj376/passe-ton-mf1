N1-surface:
  "Maîtrise de la vitesse de remontée":
    evaluer:
      question: "Que sait l'élève des dangers d'une remontée trop rapide, et comment remonte-t-il spontanément ?"
      vecu:
        - "Au baptême, a-t-il été remonté par le moniteur, ou a-t-il remonté lui-même ?"
        - "Pratique-t-il l'apnée ou la chasse sous-marine, où l'on remonte vite, en palmant ?"
        - "A-t-il déjà ressenti une gêne aux oreilles ou aux sinus en remontant ?"
      sait:
        - "Sait-il que l'air du gilet et des poumons se dilate en remontant, surtout près de la surface ?"
        - "A-t-il des idées fausses ? Par exemple : « on remonte en retenant sa respiration », ou « le gilet sert à remonter »."
        - "A-t-il entendu parler de surpression pulmonaire ou d'accident de désaturation ?"
      esprit:
        - "Est-il pressé de retrouver la surface, notamment s'il est inquiet ou a froid ?"
        - "Est-il à l'aise ou anxieux en pleine eau, sans rien à quoi se tenir ?"
      comment: "En piscine, depuis 3 m, le long d'un mur ou d'un pendeur, moniteur face à lui et prêt à le tenir, lui demander : « Remonte comme tu le sens. » On observe sa vitesse, s'il purge son gilet, s'il continue de ventiler, et s'il palme fort."
      adapter:
        - "Il remonte vite ou bloque sa respiration : on commence à l'étape 1, « Remontée le long d'un repère », en insistant sur la surpression pulmonaire."
        - "Il remonte lentement mais sans regarder ses instruments : on passe à l'étape 2, « Contrôler sa vitesse avec ses instruments »."
        - "Il maîtrise sa vitesse le long du repère : on passe à l'étape 3, « En pleine eau, sans repère »."
        - "Il est inquiet en pleine eau : on reste plus longtemps le long du repère, moniteur au contact."
    bilan:
      situation: "l'étape 5 : seul ou en palanquée, remontées de fin de plongée et remontées d'exercice"
      criteres:
        - "Il maîtrise sa vitesse aux palmes et au gilet."
        - "Il y parvient avec et sans repère."
        - "Il gère sa remontée seul, ou reste au niveau du GP en palanquée."
      securite:
        - "On ne bloque jamais sa respiration."
        - "Le moniteur tient l'élève et freine s'il accélère, tant que la vitesse n'est pas maîtrisée."
        - "La profondeur augmente progressivement, selon l'encadrement."
      eca: "accélère en pleine eau, purges tardives → reprendre l'étape 3"

  "Tenue d'un palier":
