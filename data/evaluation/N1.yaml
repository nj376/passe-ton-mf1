# Cartes « Évaluer l'élève » (début) et « Bilan » (fin) des techniques du N1.
# Proposition de stagiaire (hors MFT). Rangées par identifiant de compétence, puis nom exact de la technique
# (tel qu'il figure dans data/progressions/progressions_N1.json). Les fichiers de progression ne sont pas modifiés.
#
# evaluer.question : la question directrice
# evaluer.vecu / sait / esprit : son vécu, ce qu'il sait ou croit savoir, son état d'esprit (listes)
# evaluer.comment : comment le savoir (situation d'observation)
# evaluer.adapter : où commencer selon ce qu'on a observé (liste)
# bilan.situation : la situation finale sur laquelle porte le bilan
# bilan.criteres : critères de la situation finale (liste)
# bilan.securite : points de sécurité sans compromis (liste, éventuellement vide)
# bilan.eca : exemple de note « à retravailler → étape à reprendre »
# Les curseurs, le rappel A / ECA / NT et le lien vers la compétence sont ajoutés par les gabarits.

N1-equiper:
  "Gréage et dégréage":
    evaluer:
      question: "De quelles ressources l'élève dispose-t-il déjà pour apprendre à gréer et dégréer son scaphandre ?"
      vecu:
        - "A-t-il fait un baptême ? Si oui, a-t-il vu gréer le bloc, ou l'a-t-il reçu tout prêt ?"
        - "A-t-il déjà manipulé du matériel de plongée, ou un autre matériel technique (escalade, voile, apnée) ?"
        - "Connaît-il le matériel du club, ou a-t-il son propre matériel ?"
      sait:
        - "Sait-il nommer les pièces et dire à quoi elles servent ?"
        - "A-t-il des idées fausses ? Par exemple : « la bouteille contient de l'oxygène », ou « le direct system, c'est un détendeur de secours »."
        - "Sait-il qu'une bouteille est sous pression et qu'elle peut tomber ?"
      esprit:
        - "Est-il curieux, hésitant, inquiet, ou déjà familiarisé avec le matériel ?"
        - "Craint-il de casser quelque chose, ou au contraire va-t-il trop vite ?"
      comment: "Au sec, devant une bouteille calée et un équipement démonté, lui demander : « Montre-moi comment tu t'y prendrais. » On l'observe sans corriger, sauf pour la sécurité : on l'arrête avant qu'il ouvre le robinet face au manomètre ou qu'il lâche la bouteille. On écoute aussi la façon dont il nomme les pièces."
      adapter:
        - "Il ne connaît pas le matériel : on commence à l'étape 1, « Découverte »."
        - "Il nomme les pièces mais ne connaît pas l'ordre : on vérifie rapidement l'étape 1, puis on passe à l'étape 2, « Gréage guidé »."
        - "Il grée déjà seul, dans le bon ordre : on vérifie les points de sécurité, puis on passe à l'étape 3 ou 4."
        - "Il est inquiet : on prend plus de temps au sec, on manipule davantage, et on lui explique avant de lui faire faire."
    bilan:
      situation: "l'étape 5 : sortie club, matériel inconnu, sans aide"
      criteres:
        - "Il grée et dégrée seul, sans aide de l'encadrant et sans liste."
        - "Il fait les trois vérifications : pression, inflateur, respiration sur les deux détendeurs en regardant le manomètre."
        - "Il signale toute anomalie (pression basse, fuite, aiguille qui chute)."
        - "Il ne gêne pas les autres, puis il rince et range son matériel."
      securite:
        - "La bouteille est toujours calée, y compris dans le rack sur le bateau."
        - "Le robinet est ouvert lentement, manomètre détourné, sans personne dans l'axe."
        - "Rien n'est démonté sous pression : robinet fermé et circuit purgé d'abord."
      eca: "oublie de purger avant de démonter → reprendre l'étape 4"
  "Capelage et décapelage":
    evaluer:
      question: "Que sait déjà faire l'élève pour capeler et décapeler son scaphandre, au sec comme dans l'eau ?"
      vecu:
        - "A-t-il fait un baptême ? Si oui, s'est-il équipé lui-même, ou a-t-on capelé le bloc pour lui ?"
        - "A-t-il déjà porté un sac lourd à sangles (randonnée, escalade) ou réglé un harnais ?"
        - "A-t-il déjà plongé depuis un bateau, ou seulement en piscine ?"
      sait:
        - "Connaît-il l'ordre du capelage ? Sait-il que le lest se met en dernier et s'enlève en premier ?"
        - "A-t-il des idées fausses ? Par exemple : « le lest doit être bien serré pour ne pas tomber », ou « on enfile le bloc debout, c'est plus simple »."
        - "Sait-il qu'un gilet gonflé fait flotter l'ensemble en surface ?"
      esprit:
        - "Est-il à l'aise, ou gêné par le poids et l'encombrement du bloc ?"
        - "Redoute-t-il de s'équiper dans l'eau, surtout là où il n'a pas pied ?"
        - "Accepte-t-il l'aide d'un équipier, ou veut-il tout faire seul ?"
      comment: "Au sec, assis sur un banc, bouteille gréée posée derrière lui, lui demander : « Équipe-toi comme tu penses qu'il faut le faire. » On l'observe sans corriger, sauf pour la sécurité : on l'arrête s'il soulève le bloc à bout de bras ou s'il le laisse debout sans être calé. On regarde l'ordre des sangles et la place du lest."
      adapter:
        - "Il ne connaît pas l'ordre : on commence à l'étape 1, « Capelage aidé au sec »."
        - "Il capelle seul au sec, lest en dernier et largable : on passe à l'étape 3, « Capelage et décapelage dans l'eau, avec pied »."
        - "Il est déjà à l'aise dans l'eau avec pied : on vérifie rapidement, puis on passe à l'étape 4, « Capelage et décapelage dans l'eau, sans pied »."
        - "Il redoute l'eau profonde : on reste plus longtemps à l'étape 3, gilet gonflé, avant d'aller là où il n'a pas pied."
    bilan:
      situation: "l'étape 6 : au sec comme dans l'eau, sans aide (évaluation)"
      criteres:
        - "Il s'équipe et se déséquipe seul au sec comme dans l'eau."
        - "Son comportement est adapté à la palanquée : prêt à temps, sans gêner, il aide et accepte d'être aidé."
        - "Il respecte les précautions d'usage : lest largable, bloc jamais laissé debout sans être calé."
      securite:
        - "On capelle assis ou avec le bloc posé en hauteur ; sur bateau, on capelle assis."
        - "Le lest se met en dernier et s'enlève en premier. Rien ne doit le bloquer."
        - "Dans l'eau sans pied, gilet gonflé avant tout, moniteur à proximité."
        - "Sur bateau, on ne se déplace pas bloc sur le dos sans y être invité."
      eca: "met son lest avant de serrer ses sangles → reprendre l'étape 2"
  "Choix de son matériel personnel":
    evaluer:
      question: "Comment l'élève choisit-il aujourd'hui son masque, ses palmes, sa combinaison et son lest ?"
      vecu:
        - "A-t-il déjà son propre matériel (masque, palmes de snorkeling, combinaison de surf) ou utilise-t-il celui du club ?"
        - "A-t-il eu froid, mal aux pieds ou un masque qui fuit lors de son baptême ou en piscine ?"
        - "A-t-il déjà plongé en mer et en eau douce ?"
      sait:
        - "Sait-il essayer un masque sans la sangle, par aspiration ?"
        - "A-t-il des idées fausses ? Par exemple : « plus la combinaison est épaisse, mieux c'est », ou « plus on met de plombs, plus on est en sécurité »."
        - "Sait-il dire ce qui fait varier son lest : combinaison, bouteille, eau douce ou salée ?"
      esprit:
        - "Se fie-t-il au prix, à la marque ou aux conseils du vendeur plutôt qu'au confort ?"
        - "Est-il pressé d'acheter, ou au contraire hésite-t-il à s'équiper ?"
      comment: "Au sec, devant un choix de masques, de palmes et de combinaisons, lui demander : « Choisis ce qui te convient et explique-moi pourquoi. » Puis lui demander quel lest il prendrait pour la plongée du jour. On écoute ses raisons sans corriger."
      adapter:
        - "Il ne connaît pas le rôle de chaque élément : on commence à l'étape 1, « Découverte du matériel personnel »."
        - "Il choisit bien masque et palmes mais pas sa combinaison : on passe à l'étape 2, « Combinaison et confort »."
        - "Il ne sait pas de quoi dépend son lest : on travaille l'étape 3, « Lestage guidé »."
        - "Il choisit et justifie déjà son matériel : on vérifie l'étape 4, « Entretien et hygiène », puis on passe à l'étape 5."
    bilan:
      situation: "l'étape 6 : il arrive prêt (évaluation)"
      criteres:
        - "Son matériel est adapté à la plongée prévue et en bon état."
        - "Son lest est cohérent avec le milieu et le matériel."
        - "Il justifie ses choix à l'oral si on lui pose la question."
        - "Il prépare son matériel personnel et son lest sans aide."
      securite: []
      eca: "garde le même lest en passant de la piscine à la mer → reprendre l'étape 5"

N1-eau:
  "Saut droit":
    evaluer:
      question: "Avec quel vécu et quelles appréhensions l'élève aborde-t-il le saut droit ?"
      vecu:
        - "A-t-il l'habitude de sauter dans l'eau (piscine, plongeoir, rochers) ?"
        - "A-t-il fait son baptême depuis un bateau ? Comment s'est-il mis à l'eau ?"
        - "A-t-il déjà perdu son masque en sautant ou en plongeant ?"
      sait:
        - "Sait-il pourquoi on plaque le masque et le détendeur avec la main ?"
        - "A-t-il des idées fausses ? Par exemple : « on saute en regardant l'eau », ou « on peut sauter dès qu'on est prêt »."
        - "Sait-il qu'il faut vérifier la zone avant et la dégager après ?"
      esprit:
        - "Appréhende-t-il la hauteur, ou le saut avec le poids du bloc ?"
        - "Est-il au contraire trop pressé, prêt à sauter sans regarder ?"
      comment: "En PMT, au bord du grand bain, faible hauteur, lui demander : « Mets-toi à l'eau en sautant, comme tu le sens. » On regarde le regard, la main sur le masque, les jambes, et ce qu'il fait une fois dans l'eau. On vérifie soi-même la profondeur et la zone libre avant le saut."
      adapter:
        - "Il n'a jamais sauté ou il est inquiet : on commence à l'étape 1, « Découverte en PMT », sans le bloc."
        - "Il saute droit en PMT et dégage la zone : on passe à l'étape 2, « Saut droit en scaphandre »."
        - "Il saute déjà proprement en scaphandre : on passe à l'étape 3, « Hauteur plus importante », puis à l'étape 4."
        - "Il saute sans regarder ni attendre : on insiste sur les vérifications dès l'étape 1, puis sur l'attente du feu vert à l'étape 4."
    bilan:
      situation: "l'étape 5 : situation réelle (évaluation)"
      criteres:
        - "Le saut est maîtrisé : masque et détendeur restent en place."
        - "Il respecte les consignes du DP et attend le feu vert."
        - "Il prend en compte la sécurité des autres : zone vérifiée, puis dégagée tout de suite."
      securite:
        - "Profondeur suffisante et zone d'eau libre vérifiées avant chaque saut."
        - "Jamais de mise à l'eau sans l'accord du DP ou du GP."
      eca: "saute sans vérifier que la zone est libre → reprendre l'étape 4"
  "Bascule arrière":
    evaluer:
      question: "Comment l'élève vit-il l'idée de se laisser tomber en arrière dans l'eau, sans voir où il va ?"
      vecu:
        - "A-t-il fait son baptême depuis un pneumatique ? A-t-il basculé, ou est-il entré autrement ?"
        - "A-t-il déjà fait des chutes arrière (plongeon, jeux de piscine, kayak) ?"
        - "Est-il déjà monté sur un pneumatique en mer ?"
      sait:
        - "Sait-il pourquoi on rentre le menton et on tient masque et détendeur ?"
        - "A-t-il des idées fausses ? Par exemple : « on bascule chacun quand on est prêt », ou « on ne peut pas se faire mal en tombant dans l'eau »."
        - "Sait-il qu'il faut s'écarter du bateau aussitôt ?"
      esprit:
        - "Est-il inquiet de ne pas voir derrière lui, ou de se retrouver la tête en bas ?"
        - "Se crispe-t-il au moment de basculer ?"
      comment: "En PMT, assis au bord de la piscine, dos à l'eau, lui demander : « Laisse-toi basculer en arrière, en gardant ton masque. » Avant, on vérifie avec lui la zone libre. On regarde le menton, la main sur le masque et sa façon de retrouver la surface."
      adapter:
        - "Il n'a jamais basculé ou il est inquiet : on commence à l'étape 1, « Découverte en PMT »."
        - "Il bascule calmement en PMT : on passe à l'étape 2, « Bascule en scaphandre »."
        - "Il bascule déjà proprement en scaphandre : on passe à l'étape 3, « Depuis une embarcation »."
        - "Il a déjà basculé d'un pneumatique : on vérifie la bascule au signal, puis on passe à l'étape 4."
    bilan:
      situation: "l'étape 5 : situation réelle (évaluation)"
      criteres:
        - "La bascule est maîtrisée : rien ne se décroche, il refait surface calmement."
        - "Il bascule au signal, avec les autres, en respectant les consignes."
        - "Il se soucie de la sécurité des autres : il s'écarte du bateau et rejoint le regroupement."
      securite:
        - "La zone est confirmée libre avant de basculer : il regarde par-dessus l'épaule, le moniteur confirme."
        - "Les conditions restent celles que le DP juge compatibles avec un débutant."
      eca: "bascule avant le signal → reprendre l'étape 3"
  "Départ plage":
    evaluer:
      question: "Que sait déjà l'élève de l'entrée dans l'eau depuis une plage, avec palmes et bloc ?"
      vecu:
        - "A-t-il fait du snorkeling ou de la randonnée palmée depuis une plage ?"
        - "A-t-il l'habitude des vagues, des galets ou des fonds rocheux (baignade, surf) ?"
        - "A-t-il déjà marché avec un bloc sur le dos hors de l'eau ?"
      sait:
        - "Sait-il comment on se déplace palmes aux pieds ?"
        - "A-t-il des idées fausses ? Par exemple : « on chausse ses palmes sur le sable », ou « on met le détendeur en bouche une fois au large »."
        - "Sait-il qu'une vague peut le déséquilibrer avec le poids du bloc ?"
      esprit:
        - "Craint-il de tomber ou d'être roulé par une vague ?"
        - "Accepte-t-il de s'appuyer sur un équipier ?"
      comment: "En PMT, sur une plage calme à fond régulier, lui demander : « Mets-toi à l'eau et chausse tes palmes. » On regarde où il chausse ses palmes, comment il se déplace et s'il cherche un appui. On l'arrête s'il marche en avant palmes aux pieds."
      adapter:
        - "Il ne connaît pas la technique : on commence à l'étape 1, « Découverte en PMT »."
        - "Il entre proprement en PMT : on passe à l'étape 2, « Départ plage en scaphandre »."
        - "Il est à l'aise en scaphandre sur fond régulier : on passe à l'étape 3, « Fond irrégulier ou léger ressac »."
        - "Il craint les vagues : on reste sur plage calme aux étapes 1 et 2, et on travaille l'étape 4, « Retour à la plage », avant le ressac."
    bilan:
      situation: "l'étape 5 : situation réelle (évaluation), depuis une plage en milieu naturel"
      criteres:
        - "Le départ et le retour sont maîtrisés, sans chute ni perte de matériel."
        - "Il s'entraide avec ses équipiers : appui pour chausser et retirer les palmes, équipiers attendus."
        - "Il respecte les consignes du DP."
      securite:
        - "On ne marche jamais en avant avec les palmes aux pieds : on recule ou on avance de côté."
        - "Masque en place et détendeur en bouche avant d'entrer dans la zone où les vagues cassent."
        - "Le DP juge les conditions."
      eca: "chausse ses palmes trop tôt et chute → reprendre l'étape 2"
  "Sortir de l'eau":
    evaluer:
      question: "Comment l'élève sort-il de l'eau aujourd'hui, et que sait-il de la sortie sur une embarcation ?"
      vecu:
        - "A-t-il fait son baptême depuis un bateau ? Comment est-il remonté à bord ?"
        - "A-t-il déjà retiré son bloc-gilet dans l'eau, ou toujours au bord ?"
        - "A-t-il l'habitude de remonter sur un bateau ou un ponton (baignade, kayak) ?"
      sait:
        - "Sait-il qu'on gonfle le gilet avant de défaire les sangles ?"
        - "A-t-il des idées fausses ? Par exemple : « on remonte à l'échelle avec tout son matériel », ou « on peut retirer son masque dès qu'on est en surface »."
        - "Sait-il que l'ordre de passage du matériel est donné par le GP ou le pilote ?"
      esprit:
        - "Est-il fatigué ou pressé de sortir en fin de plongée ?"
        - "Craint-il de perdre son matériel ou de ne pas réussir à remonter sur le support ?"
      comment: "En piscine, au bord, en fin de séance, lui demander : « Sors de l'eau avec ton matériel. » On regarde s'il gonfle son gilet, s'il garde une main sur le bloc et comment il le passe. On l'arrête s'il défait ses sangles gilet vide."
      adapter:
        - "Il ne sait pas retirer son bloc-gilet en surface : on commence à l'étape 1, « Retirer son bloc-gilet en surface »."
        - "Il retire son bloc-gilet sans le lâcher : on passe à l'étape 2, « Passer le matériel au support »."
        - "Il passe déjà son matériel et remonte seul : on passe à l'étape 3, « Embarcation en milieu naturel »."
        - "Il est pressé ou fatigué : on travaille l'attente calme de l'étape 4, « Plusieurs plongeurs, léger clapot »."
    bilan:
      situation: "l'étape 5 : situation réelle (évaluation)"
      criteres:
        - "Le retrait du bloc-gilet et le passage au support sont maîtrisés."
        - "Il respecte les consignes du DP, du GP ou du pilote."
        - "Il se soucie des autres : il attend son tour et aide si besoin."
      securite:
        - "Gilet gonflé avant de défaire les sangles, pour que le bloc flotte."
        - "Rien n'est lâché avant que la personne à bord ait pris le matériel."
        - "Masque en place tant qu'il est dans l'eau."
        - "Jamais près de l'arrière du bateau sans l'accord du pilote."
      eca: "lâche son bloc avant qu'on l'ait pris → reprendre l'étape 2"

N1-immerger:
  "Phoque":
    evaluer:
      question: "De quelles ressources l'élève dispose-t-il pour s'immerger en phoque, sans palmer ?"
      vecu:
        - "A-t-il déjà fait de l'apnée, ou plongé au fond d'une piscine ?"
        - "A-t-il eu mal aux oreilles lors de son baptême ou en allant chercher un objet au fond ?"
        - "Lors de son baptême, a-t-il eu du mal à descendre ?"
      sait:
        - "Sait-il équilibrer ses oreilles, et à quel moment ?"
        - "A-t-il des idées fausses ? Par exemple : « on descend en palmant vers le bas », ou « si ça fait mal, il faut forcer un peu »."
        - "Sait-il que l'expiration aide à descendre ?"
      esprit:
        - "Appréhende-t-il la descente, la profondeur ou la douleur aux oreilles ?"
        - "A-t-il tendance à se précipiter, ou à bloquer sa respiration ?"
      comment: "En PMT, à faible profondeur, le long d'un mur ou d'une échelle, lui demander : « Descends de quelques mètres sans palmer. » On regarde la position, l'expiration et le moment où il équilibre ses oreilles. On surveille depuis la surface et on vérifie qu'il ne s'hyperventile pas avant."
      adapter:
        - "Il ne connaît pas la technique ou il équilibre mal : on commence à l'étape 1, « Phoque en PMT »."
        - "Il descend en phoque en PMT : on passe à l'étape 2, « Phoque en scaphandre le long d'un repère »."
        - "Il descend avec le bloc mais doit palmer ou se sent lourd : on travaille l'étape 3, « Lestage et équilibre à 3 m »."
        - "Il est inquiet pour ses oreilles : on reste le long d'un repère, plus lentement, avant la pleine eau de l'étape 4."
    bilan:
      situation: "l'étape 5 : à la commande du GP (évaluation)"
      criteres:
        - "Il s'immerge sans délai au signe du GP, en PMT comme en scaphandre."
        - "Il reste près du GP."
        - "Ses oreilles sont équilibrées."
      securite:
        - "Pas d'hyperventilation avant l'apnée."
        - "En cas de douleur, on s'arrête et on remonte un peu. On ne force jamais."
        - "En PMT, faible profondeur et surveillance permanente depuis la surface."
      eca: "doit palmer pour démarrer la descente → reprendre l'étape 3"
  "Canard":
    evaluer:
      question: "Que sait déjà faire l'élève pour s'immerger en canard, tête la première ?"
      vecu:
        - "A-t-il déjà fait des canards en natation, en apnée ou en snorkeling ?"
        - "Va-t-il volontiers chercher un objet au fond d'une piscine ?"
        - "A-t-il eu mal aux oreilles en descendant tête en bas ?"
      sait:
        - "Sait-il que c'est le poids des jambes hors de l'eau qui le fait descendre ?"
        - "A-t-il des idées fausses ? Par exemple : « on palme fort dès le départ pour descendre », ou « on équilibre une fois au fond »."
        - "Sait-il que, tête en bas, les oreilles se compriment vite ?"
      esprit:
        - "Est-il à l'aise la tête en bas, ou désorienté ?"
        - "Appréhende-t-il de toucher le fond ou de remonter trop vite ?"
      comment: "En PMT, en petit fond, lui demander : « Va toucher le fond en partant de la surface. » On regarde la bascule du buste, les jambes, le palmage en surface et le moment où il équilibre. On surveille depuis la surface et on vérifie qu'il ne s'hyperventile pas."
      adapter:
        - "Il plie mal le buste ou palme en surface : on commence à l'étape 1, « Découverte en PMT »."
        - "Il fait un canard correct mais peu efficace : on passe à l'étape 2, « Canard en PMT jusqu'au fond »."
        - "Il est efficace en PMT : on passe à l'étape 3, « Canard en scaphandre »."
        - "Il est désorienté tête en bas : on garde un repère et une faible profondeur avant la pleine eau de l'étape 4."
    bilan:
      situation: "l'étape 5 : à la commande du GP (évaluation)"
      criteres:
        - "Il applique sans délai la technique annoncée par le GP."
        - "Il reste près du GP."
        - "Sa descente est contrôlée, oreilles équilibrées."
      securite:
        - "Pas d'hyperventilation."
        - "En PMT, profondeur modérée et surveillance depuis la surface par un équipier ou le moniteur."
        - "Équilibrer tôt, ne jamais forcer."
      eca: "heurte le fond en passant à l'horizontale → reprendre l'étape 3"

N1-milieu:
  "Aisance aquatique":
    evaluer:
      question: "Comment l'élève évolue-t-il près du fond, et quel regard porte-t-il sur le milieu ?"
      vecu:
        - "A-t-il fait du snorkeling ou de la randonnée palmée en mer ?"
        - "Lors de son baptême, a-t-il touché le fond ou les animaux, ou s'est-il fait tenir ?"
        - "Connaît-il déjà la faune et la flore locales ?"
      sait:
        - "Sait-il se déplacer sans s'aider des mains ni du fond ?"
