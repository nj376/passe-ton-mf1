  "Gonflage du gilet en surface":
    evaluer:
      question: "Que fait l'élève en arrivant en surface pour se mettre en sécurité ?"
      vecu:
        - "Au baptême, est-ce le moniteur qui gonflait son gilet en surface ?"
        - "Est-il bon nageur, habitué à tenir en surface en palmant ?"
