  "Nage capelée sur 500 m":
    evaluer:
      question: "Avec quelle condition physique et quel vécu le candidat aborde-t-il la nage capelée de 500 m ?"
      vecu:
        - "Comment s'est passée sa nage capelée de 300 m au N3 ?"
        - "Nage-t-il souvent capelé en surface, par exemple pour rejoindre un site ?"
        - "S'entraîne-t-il en nage PMT en parallèle ?"
      sait:
        - "Connaît-il les règles de l'épreuve : sur le tuba, sans les bras, bouteille ouverte, détendeur en main ?"
        - "A-t-il des idées fausses ? Par exemple : « on peut se reposer en respirant sur le détendeur », ou « on nage plus vite sur le dos »."
      esprit:
        - "L'épreuve lui paraît-elle facile, ou redoute-t-il l'essoufflement ?"
        - "Sait-il gérer son allure sur la durée ?"
      comment: "L'étape 1, « Bilan des acquis N3 », sert d'observation : 300 m capelé. On regarde l'essoufflement, la position, l'usage des bras et du scaphandre. On lui demande ensuite comment il compte passer de 300 à 500 m."
      adapter:
        - "Il s'essouffle sur 300 m : on reste à l'étape 1 et on associe un entraînement en nage PMT."
        - "Il nage 300 m à l'aise mais s'aide des bras ou du détendeur : on passe à l'étape 2, « Technique de l'épreuve »."
        - "La technique est conforme : on passe à l'étape 3, « 500 m chronométré »."
    bilan:
      situation: "l'étape 4 : épreuve 9 (évaluation)"
      criteres:
        - "Départ groupé, parcours déterminé de 500 m."
        - "Fait en moins de 16 minutes."
        - "Nage ventrale sur le tuba, sans aide des bras ni utilisation du scaphandre."
      securite:
        - "Bouteille ouverte et détendeur en main pendant toute la nage."
      eca: "s'aide des bras dès qu'il fatigue → reprendre l'étape 2"

N4-theorie:
  "Risques de l'activité, mesures de prévention et bonnes pratiques":
    evaluer:
      question: "Que reste-t-il au candidat de ses connaissances sur les accidents, et sait-il les relier au rôle du guide de palanquée ?"
      vecu:
        - "Quand a-t-il passé son N3 ? A-t-il révisé depuis ?"
        - "A-t-il été témoin d'un accident, d'un essoufflement ou d'une narcose marquée ?"
        - "A-t-il suivi le RIFAP ? Depuis combien de temps ?"
      sait:
        - "Ses connaissances sont-elles comprises ou seulement apprises par cœur ?"
        - "A-t-il des idées fausses ? Par exemple : « en respectant son ordinateur, on ne risque pas d'accident de désaturation », ou « la narcose, ça n'arrive qu'aux débutants »."
        - "Sait-il dire ce que fait le GP, et pas seulement ce qu'est l'accident ?"
      esprit:
        - "Est-il à l'aise à l'écrit, ou l'épreuve théorique l'inquiète-t-elle ?"
        - "Pense-t-il en savoir assez, ou au contraire se sent-il perdu ?"
      comment: "L'étape 1, « Bilan des acquis N3 », sert d'observation : quelques questions sur les accidents vus au N3, puis un cas court : « Un plongeur de ta palanquée s'essouffle à 30 m. Que fais-tu ? » On écoute la justesse des mécanismes et la place donnée au rôle du GP."
      adapter:
        - "Ses bases N3 sont fragiles : on fait une révision ciblée à l'étape 1."
        - "Il connaît les accidents mais n'explique pas l'essoufflement : on passe à l'étape 2, « Oreille et ventilation »."
        - "Il explique les mécanismes sans parler du rôle du GP : on travaille les cas pratiques des étapes 3 et 4."
        - "L'écrit l'inquiète : on lui fait faire des études de cas courtes et chronométrées avant l'étape 5."
    bilan:
      situation: "l'étape 5 : épreuves 10 et 11 (évaluation)"
      criteres:
        - "Ses réponses sont justes et orientées sur le rôle du GP."
        - "Pour chaque accident, il cite les situations et les comportements adaptés du GP."
        - "Il explique l'essoufflement et la prévention des accidents de désaturation, schéma à l'appui."
      securite: []
      eca: "décrit bien les accidents de désaturation mais ne dit pas ce que fait le GP → reprendre l'étape 4"
  "Outils et procédures de désaturation":
    evaluer:
      question: "Comment le candidat comprend-il et utilise-t-il son ordinateur de plongée ?"
      vecu:
        - "Depuis quand plonge-t-il avec un ordinateur ? A-t-il appris les tables avant ?"
        - "A-t-il déjà réglé lui-même le conservatisme de son ordinateur ?"
        - "A-t-il plongé avec des plongeurs dont l'ordinateur indiquait autre chose que le sien ?"
      sait:
        - "Sait-il expliquer la saturation et la sursaturation avec ses mots ?"
        - "A-t-il des idées fausses ? Par exemple : « l'ordinateur sait ce qui se passe dans mon corps », ou « plus on fait de paliers profonds, plus on est en sécurité »."
        - "Sait-il lire les écrans de son ordinateur et utiliser le mode planification ?"
      esprit:
        - "Fait-il une confiance totale à son ordinateur, ou s'en méfie-t-il ?"
        - "La partie théorique sur les modèles l'inquiète-t-elle ?"
      comment: "Au sec, lui montrer une courbe de plongée et une capture d'écran d'ordinateur, puis lui demander : « Explique-moi ce que tu vois, et ce que tu ferais en tant que GP. » On écoute ce qu'il comprend des états de saturation et de ce qu'affiche l'ordinateur."
      adapter:
        - "Il ne sait pas expliquer la saturation : on commence à l'étape 1, « Dissolution de l'azote »."
        - "Il comprend la saturation mais pas le principe des ordinateurs : on passe à l'étape 2, « Modèles »."
        - "Il connaît le principe mais lit mal les écrans : on travaille l'étape 3, « Ordinateurs »."
        - "Il maîtrise son propre ordinateur : on passe à l'étape 4, « Procédures différentes dans une palanquée »."
    bilan:
      situation: "l'étape 5 : épreuve 10 (évaluation)"
      criteres:
        - "Ses réponses sont justes, en connaissances comme en études de cas."
        - "Il analyse juste une capture d'ordinateur et adopte un comportement adapté en tant que GP."
        - "Il identifie avant la plongée les procédures différentes dans sa palanquée et agit en conséquence."
      securite: []
      eca: "lit bien son ordinateur mais ne prévoit rien pour des conservatismes différents → reprendre l'étape 4"
  "Réglementation relative à l'activité":
    evaluer:
      question: "Que sait le candidat de ses responsabilités et de ses prérogatives de guide de palanquée ?"
      vecu:
        - "A-t-il déjà lu le Code du sport ou les textes de la FFESSM ?"
        - "Connaît-il le fonctionnement de son club : licence, assurance, CACI, rôle du DP ?"
        - "A-t-il entendu parler d'un accident qui a eu des suites judiciaires ?"
      sait:
        - "Sait-il dire ce qu'il pourra faire en autonomie et en encadrement une fois N4 ?"
        - "A-t-il des idées fausses ? Par exemple : « avec l'assurance du club, je ne risque rien », ou « le GP décide seul du site et de la profondeur »."
        - "Distingue-t-il responsabilité civile et responsabilité pénale ?"
      esprit:
        - "La réglementation lui paraît-elle utile, ou rébarbative ?"
        - "Le poids de la responsabilité l'inquiète-t-il ?"
      comment: "Au sec, lui proposer un cas court : « Tu guides trois N1 et l'un remonte seul. Quelles sont tes responsabilités ? Qu'aurait dû faire le DP ? » On écoute s'il mobilise les notions de responsabilité, de prérogatives et de rôle du DP."
      adapter:
        - "Il ignore les notions de responsabilité : on commence à l'étape 1, « Responsabilité du GP »."
        - "Il connaît les responsabilités mais pas la structure fédérale : on passe à l'étape 2, « La FFESSM »."
        - "Il confond ses prérogatives et celles du DP : on travaille l'étape 3, « Code du sport »."
        - "Il maîtrise le reste : on termine par l'étape 4, « Les normes »."
    bilan:
      situation: "l'étape 5 : épreuve 12 (évaluation)"
      criteres:
        - "Ses réponses sont justes dans le cadre des prérogatives du GP."
        - "Il applique les notions de responsabilité à des cas de plongée."
        - "Il situe ses prérogatives dans chaque situation et connaît le rôle du DP."
      securite: []
      eca: "s'attribue des décisions qui reviennent au DP → reprendre l'étape 3"
  "Connaissance du matériel de plongée":
    evaluer:
      question: "Que sait le candidat du fonctionnement du matériel qu'il utilise à chaque plongée ?"
      vecu:
        - "A-t-il déjà vu fonctionner un compresseur, ou participé au gonflage ?"
        - "Entretient-il son propre matériel ? A-t-il déjà démonté un détendeur, ou assisté à une révision ?"
        - "A-t-il vécu une panne : détendeur en débit continu, givrage, fuite ?"
      sait:
        - "Sait-il expliquer simplement ce qui ouvre et ferme le clapet d'un détendeur ?"
        - "A-t-il des idées fausses ? Par exemple : « un détendeur surcompensé donne plus d'air », ou « la requalification, c'est seulement pour l'administration »."
        - "Connaît-il les fonctions et les réglages de son ordinateur ?"
      esprit:
        - "La mécanique l'intéresse-t-elle, ou la redoute-t-il ?"
        - "L'oral l'inquiète-t-il ?"
      comment: "Au sec, lui donner un schéma d'éclaté de premier étage et lui demander : « Explique-moi comment ça marche. » On écoute la justesse et la simplicité de l'explication. Puis on lui demande de présenter son ordinateur et ses réglages."
      adapter:
        - "Il ne connaît ni le gonflage ni les blocs : on commence à l'étape 1, « Compresseur et blocs »."
        - "Il ne sait pas expliquer le détendeur : on passe à l'étape 2, « Détendeurs »."
        - "Il explique bien le détendeur mais connaît mal son ordinateur : on travaille l'étape 3, « Manomètre, gilet, ordinateur »."
        - "L'oral l'inquiète : on multiplie les explications courtes à partir de planches avant l'étape 4."
    bilan:
      situation: "l'étape 4 : épreuve 13 (évaluation)"
      criteres:
        - "Ses explications sont justes et simples, à partir de planches, de dessins ou d'éclatés."
        - "Il décrit les forces qui ouvrent et ferment le clapet, sans calcul."
        - "Il décrit son ordinateur, justifie ses choix et lit les écrans courants."
      securite:
        - "Gonflage uniquement sous la responsabilité d'une personne habilitée."
      eca: "récite le fonctionnement du détendeur sans pouvoir le montrer sur un éclaté → reprendre l'étape 2"
