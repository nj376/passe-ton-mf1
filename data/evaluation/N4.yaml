N4-ipd:
  "Intervention sur un plongeur en difficulté à 40 m":
    evaluer:
      question: "Avec quel vécu et quel état d'esprit le candidat aborde-t-il l'intervention à 40 m ?"
      vecu:
        - "Quand a-t-il passé son PA40 ? A-t-il refait des assistances depuis ?"
        - "Plonge-t-il régulièrement vers 40 m, ou seulement de temps en temps ?"
        - "A-t-il déjà assisté réellement un plongeur, ou été assisté ?"
      sait:
        - "Sait-il pourquoi on remonte au gilet, sans palmer ni regonfler ?"
        - "A-t-il des idées fausses ? Par exemple : « on attend 35 m pour prendre en charge », ou « le parachute, on l'accroche à soi pour ne pas le perdre »."
        - "Connaît-il les critères de l'épreuve 5 : prise en charge, vitesse, profil, profondeur plafond, tour d'horizon ?"
      esprit:
        - "Est-il confiant, ou l'épreuve l'inquiète-t-elle ?"
        - "Comment vit-il la narcose ? En parle-t-il ouvertement ?"
      comment: "L'étape 1, « Bilan des acquis PA40 », sert d'observation : assistance intégrale depuis 40 m, le moniteur dans le rôle de l'assisté. On regarde la prise en charge, la vitesse, le profil et la fin de remontée. Avant la plongée, on lui demande comment il va s'y prendre ; après, ce qu'il a ressenti."
      adapter:
        - "L'assistance n'est pas sûre : on reprend la progression PA40."
        - "Il remonte en palmant ou en regonflant : on passe à l'étape 2, « Remontée au gilet depuis 25 m »."
        - "La remontée est maîtrisée depuis 25 m : on passe à l'étape 3, puis à l'étape 4, « Situation évolutive »."
        - "Il est inquiet ou sensible à la narcose : on allonge l'accoutumance progressive à la profondeur avant l'étape 3."
    bilan:
      situation: "l'étape 6 : épreuve 5 (évaluation)"
      criteres:
        - "La prise en charge est immédiate et la vitesse maîtrisée au plus tard à 35 m."
        - "Le profil et la profondeur plafond sont conformes, sans redescente de plus de 2 m."
        - "Il marque l'arrêt entre 8 et 6 m, fait un tour d'horizon en gardant son niveau, puis déploie le parachute sans perte de profondeur."
        - "Aucun critère éliminatoire."
      securite:
        - "L'assisté est le moniteur. Formation dans l'espace 0-40 m sous la responsabilité d'un encadrant E3 minimum."
        - "Accoutumance progressive à la profondeur. Le moniteur assisté peut interrompre l'exercice à tout moment."
        - "Parachute : jamais attaché au plongeur, ligne libre."
      eca: "perd le contrôle de la vitesse quand l'assisté lâche son détendeur → reprendre l'étape 4"

N4-techniques:
  "Descente, stabilisation et vidage de masque à 40 m":
