        - "Il résume bien mais n'explique pas ses interventions : on passe à l'étape 2, « Expliquer ses interventions »."
        - "Il évite tout recadrage, ou il recadre avec reproche : on travaille l'étape 3, « Recadrer si nécessaire »."
