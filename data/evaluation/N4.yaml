# Cartes « Évaluer l'élève » (début) et « Bilan » (fin) des techniques du N4.
# Proposition de stagiaire (hors MFT). Rangées par identifiant de compétence, puis nom exact de la technique
# (tel qu'il figure dans data/progressions/progressions_N4.json). Les fichiers de progression ne sont pas modifiés.
#
# evaluer.question : la question directrice
# evaluer.vecu / sait / esprit : son vécu, ce qu'il sait ou croit savoir, son état d'esprit (listes)
# evaluer.comment : comment le savoir (situation d'observation)
# evaluer.adapter : où commencer selon ce qu'on a observé (liste)
# bilan.situation : la situation finale sur laquelle porte le bilan
# bilan.criteres : critères de la situation finale (liste)
# bilan.securite : points de sécurité sans compromis (liste, éventuellement vide)
# bilan.eca : exemple de note « à retravailler → étape à reprendre »
# Les curseurs, le rappel A / ECA / NT et le lien vers la compétence sont ajoutés par les gabarits.


N4-accueil:
  "Adopter en toutes circonstances un comportement respectueux des valeurs du sport et de la Fédération":
    evaluer:
      question: "Quelle idée le candidat se fait-il de l'attitude d'un guide face aux plongeurs, y compris quand la situation se tend ?"
      vecu:
        - "Quels guides l'ont marqué, en bien ou en mal ? Qu'a-t-il retenu de leur façon d'accueillir ?"
        - "A-t-il déjà vu un encadrant refuser une plongée à quelqu'un ? Comment cela s'est-il passé ?"
        - "A-t-il déjà accompagné des plongeurs de façon informelle, au club ou en voyage ?"
      sait:
        - "Sait-il dire ce qu'on attend d'un guide au-delà de la technique : écoute, disponibilité, respect ?"
        - "A-t-il des idées fausses ? Par exemple : « un client mécontent, on lui donne ce qu'il veut », ou « un guide n'a pas à se justifier »."
        - "Sait-il que préserver l'intégrité physique du plongeur peut obliger à refuser ?"
      esprit:
        - "Est-il naturellement avenant, ou plutôt réservé avec des inconnus ?"
        - "Redoute-t-il le conflit, au point de céder pour l'éviter ?"
      comment: "Au sec, lui faire raconter un accueil qu'il a vécu, puis lui poser un cas court : « Un plongeur arrive en retard et veut plonger plus profond que prévu. Que lui dis-tu ? » On écoute le ton qu'il prend autant que sa réponse, sans corriger."
      adapter:
        - "Il n'a pas d'image claire d'un bon accueil : on commence à l'étape 1, « Observer un accueil »."
        - "Il décrit bien les attitudes attendues : on passe à l'étape 2, « Accueillir des plongeurs connus »."
        - "Il est à l'aise avec les plongeurs du club mais cède face à la pression : on travaille l'étape 3, « Situation plus délicate »."
        - "Il se montre trop directif ou cassant : on reprend l'étape 2 en insistant sur l'écoute, avant l'étape 3."
    bilan:
      situation: "l'étape 4 : épreuve 4 (évaluation), conduite de palanquée sur sujet tiré"
      criteres:
        - "Son comportement est respectueux des valeurs du sport et de la Fédération du début à la fin."
        - "Il reste avenant et disponible, y compris quand la situation se tend."
        - "Il respecte la déontologie et préserve l'intégrité physique du plongeur, quitte à refuser."
      securite: []
      eca: "cède à un plongeur qui veut plonger hors de ses prérogatives → reprendre l'étape 3"
  "Accueillir, informer et prendre en charge les plongeurs":
    evaluer:
      question: "Que sait déjà faire le candidat pour accueillir un plongeur qu'il ne connaît pas et le prendre en charge ?"
      vecu:
        - "Comment l'ont accueilli ses propres guides : questions posées, matériel regardé, ou rien du tout ?"
        - "A-t-il déjà répondu aux questions d'un plongeur moins expérimenté sur son parcours ou son matériel ?"
        - "A-t-il déjà plongé dans une palanquée de niveaux très différents ?"
      sait:
        - "Sait-il quelles informations demander : niveau, nombre de plongées, date de la dernière, moyen de désaturation, état du jour ?"
        - "A-t-il des idées fausses ? Par exemple : « la carte de niveau suffit », ou « le matériel, c'est l'affaire de chacun »."
        - "Connaît-il assez le cursus et les qualifications pour orienter un plongeur ?"
      esprit:
        - "Ose-t-il poser des questions à un plongeur plus âgé ou plus expérimenté que lui ?"
        - "Craint-il de ne pas savoir répondre aux questions qu'on lui posera ?"
      comment: "Au sec, face à un plongeur du club qu'il connaît peu, lui demander : « Tu vas l'encadrer tout à l'heure. Prends-le en charge. » On note les questions posées, s'il regarde le matériel, et ce qu'il fait des réponses."
      adapter:
        - "Il pose peu de questions ou des questions inutiles : on commence à l'étape 1, « Évaluer l'expérience »."
        - "Il recueille bien l'expérience mais ignore le matériel : on passe à l'étape 2, « Vérifier le matériel »."
        - "Il est démuni face aux questions sur le cursus : on travaille l'étape 3, « Informer et orienter »."
        - "Il prend déjà bien en charge un plongeur seul : on passe à l'étape 4, « Palanquée hétérogène »."
    bilan:
      situation: "l'étape 5 : épreuve 4 (évaluation), conduite de palanquée sur sujet tiré"
      criteres:
        - "L'expérience de chaque plongeur est évaluée en peu de questions."
        - "Le matériel est vérifié ; un matériel inadapté est repéré et une solution proposée."
        - "Les plongeurs sont informés, orientés et pris en charge ; personne n'est oublié."
      securite: []
      eca: "ne demande pas le moyen de désaturation de chacun → reprendre l'étape 1"
  "Promouvoir la structure et la FFESSM":
    evaluer:
      question: "Que connaît le candidat de son club et de la Fédération, et se voit-il en donner envie aux autres ?"
      vecu:
        - "Depuis combien de temps est-il au club ? A-t-il pratiqué d'autres activités fédérales (bio, photo, apnée, nage avec palmes) ?"
        - "Un encadrant lui a-t-il un jour donné envie de passer un niveau ou de tester une activité ?"
        - "A-t-il déjà parlé du club à quelqu'un qui a fini par s'inscrire ?"
      sait:
        - "Sait-il présenter en quelques phrases les activités de son club et les commissions fédérales ?"
        - "A-t-il des idées fausses ? Par exemple : « promouvoir, c'est vendre », ou « ce n'est pas le rôle du guide »."
      esprit:
        - "Est-il attaché à son club, ou le vit-il comme un simple prestataire ?"
        - "Est-il à l'aise pour engager la conversation en fin de sortie ?"
      comment: "Au sec, lui demander : « Un plongeur de passage te demande ce qu'on fait ici à part plonger. Que lui réponds-tu ? » On écoute ce qu'il cite, et s'il relie sa réponse aux envies du plongeur."
      adapter:
        - "Il connaît mal l'offre du club et de la Fédération : on commence à l'étape 1, « Connaître l'offre »."
        - "Il connaît l'offre mais la récite sans écouter : on passe à l'étape 2, « Inciter à la pratique »."
        - "Il propose déjà des activités pertinentes : on travaille l'étape 3, « Fidéliser », puis l'étape 4 au fil des sorties."
    bilan:
      situation: "l'étape 4 : en situation (aptitude visée), sorties club au fil de la formation"
      criteres:
        - "Il présente l'offre du club et les activités fédérales en quelques phrases."
        - "Il incite à la pratique par une proposition adaptée aux envies du plongeur."
        - "Il fidélise : proposition concrète, faite au bon moment."
      securite: []
      eca: "propose la même formation à tout le monde → reprendre l'étape 2"

N4-organiser:
  "Participer aux manœuvres et à la mise en place du matériel de sécurité":
    evaluer:
      question: "Quelle expérience du bateau et des nœuds le candidat apporte-t-il, et comment voit-il son rôle d'équipier du DP ?"
      vecu:
        - "A-t-il déjà aidé le pilote à l'amarrage, au mouillage ou à la récupération des plongeurs ?"
        - "Pratique-t-il la voile, la pêche ou une autre activité nautique ?"
        - "A-t-il déjà mis en place un pendeur ou un bloc de secours, ou les a-t-il toujours trouvés installés ?"
      sait:
        - "Sait-il faire les nœuds de chaise, de cabestan, d'arrêt et de taquet ?"
        - "A-t-il des idées fausses ? Par exemple : « le bateau, c'est l'affaire du pilote », ou « on retient le bateau avec le pied contre le quai »."
        - "Sait-il nommer le matériel de sécurité présent à bord et à quoi il sert ?"
      esprit:
        - "Est-il spontanément serviable sur le bateau, ou attend-il qu'on lui demande ?"
        - "Craint-il de mal faire devant le pilote, au point de rester à l'écart ?"
      comment: "Au sec, avec un bout et un taquet ou un anneau, lui demander : « Fais-moi les nœuds que tu connais, et dis-moi où tu t'en sers. » Puis, sur le bateau, lui demander de montrer le matériel de sécurité et d'expliquer son rôle."
      adapter:
        - "Il ne connaît pas les nœuds usuels : on commence à l'étape 1, « Les nœuds au sec »."
        - "Il fait les nœuds au sec mais hésite sur le bateau : on passe à l'étape 2, « Les nœuds en situation »."
        - "Il est à l'aise avec les nœuds et les manœuvres : on travaille l'étape 4, « Installer les supports de sécurité »."
        - "Il est trop entreprenant sur le bateau : on insiste dès l'étape 3, « Aider le pilote », sur la priorité des consignes du pilote."
    bilan:
      situation: "l'étape 5 : cas simples (évaluation), épreuve 6"
      criteres:
        - "Ses réponses et ses gestes sont justes face aux cas décrits par le jury."
        - "Ses nœuds sont justes et rapides, il anticipe les demandes du pilote."
        - "Il installe le matériel de sécurité et explique le rôle de chaque élément."
      securite:
        - "Les consignes du pilote priment."
        - "Jamais de main ni de pied entre la coque et le quai."
        - "Attention à l'hélice lors de la récupération des plongeurs."
      eca: "installe le pendeur sans savoir expliquer à quoi il sert → reprendre l'étape 4"
  "Participer au choix du site de plongée":
    evaluer:
      question: "Comment le candidat lit-il un site de plongée, et sait-il le relier au niveau des plongeurs et aux conditions du jour ?"
      vecu:
        - "Quels sites connaît-il bien ? Pourrait-il en dessiner un de mémoire ?"
        - "A-t-il déjà vu un DP changer de site ou de zone à cause du vent ou du courant ?"
        - "A-t-il déjà plongé un site trop difficile pour un plongeur de sa palanquée ?"
      sait:
        - "Sait-il décrire un site : profondeurs, relief, abri, exposition au courant et au vent ?"
        - "A-t-il des idées fausses ? Par exemple : « un beau site convient à tout le monde », ou « le choix du site ne regarde que le DP »."
      esprit:
        - "Se fie-t-il surtout à l'intérêt du site, ou pense-t-il d'abord aux plongeurs ?"
        - "Ose-t-il donner son avis au DP ?"
      comment: "Au sec, lui demander de décrire un site qu'il connaît bien, puis : « Demain, tu y emmènes des PE12. Quelle zone et quel parcours ? » On regarde si sa description est complète et si son choix est justifié."
      adapter:
        - "Sa description est incomplète : on commence à l'étape 1, « Caractéristiques d'un site »."
        - "Il décrit bien le site mais propose le même parcours à tous : on passe à l'étape 2, « Site et parcours selon les plongeurs »."
        - "Il adapte déjà le parcours au niveau : on travaille l'étape 3, « Site et conditions du jour »."
    bilan:
      situation: "l'étape 4 : cas simples (évaluation), épreuve 6"
      criteres:
        - "Les caractéristiques du site sont décrites de façon complète et juste."
        - "La zone et le parcours sont définis selon le niveau des plongeurs."
        - "Le choix est cohérent avec la météo et le courant du jour, et justifié."
      securite: []
      eca: "choisit la zone sans tenir compte du courant annoncé → reprendre l'étape 3"
  "Connaissance des règles élémentaires de sécurité et de navigation en mer":
    evaluer:
      question: "Que sait déjà le candidat pour s'informer avant une sortie et se repérer en mer ?"
      vecu:
        - "Consulte-t-il la météo marine avant ses plongées ? Où ?"
        - "A-t-il déjà vu un pilote retrouver un site par alignements ou au GPS ?"
        - "A-t-il un permis bateau ou une pratique de la navigation ?"
      sait:
        - "Sait-il où trouver les zones interdites et les réserves de sa région ?"
        - "A-t-il des idées fausses ? Par exemple : « avec le GPS, plus besoin d'amers », ou « la carte marine, c'est pour les marins »."
        - "Sait-il ce que sont des amers et des enseignures ?"
      esprit:
        - "S'intéresse-t-il à la navigation, ou la juge-t-il hors sujet pour un guide ?"
        - "Est-il intimidé par la carte marine et les instruments ?"
      comment: "Au sec, lui demander : « Prépare-moi les informations utiles pour la sortie de demain. » Puis lui montrer une carte marine du secteur : « Que lis-tu ici ? » On note ses sources et les symboles qu'il reconnaît."
      adapter:
        - "Il ne sait pas où s'informer : on commence à l'étape 1, « Où s'informer »."
        - "Il s'informe bien mais ne se repère pas à vue : on passe à l'étape 2, « Amers et enseignures »."
        - "Il se repère à vue : on travaille l'étape 3, « Cartes marines », puis l'étape 4, « GPS et sonar »."
    bilan:
      situation: "l'étape 5 : cas simples (évaluation), épreuve 6"
      criteres:
        - "Ses réponses sont justes et pratiques face aux cas décrits par le jury."
        - "Il trouve et résume les informations utiles pour une sortie."
        - "Il retrouve un site par alignements et lit les symboles courants d'une carte marine."
      securite: []
      eca: "ne sait pas où trouver les zones interdites → reprendre l'étape 1"

N4-briefing:
  "Écouter et intégrer les consignes du DP":
    evaluer:
      question: "Que retient le candidat d'un briefing du DP, et sait-il en faire le cadre de sa propre plongée ?"
      vecu:
        - "Que retient-il, en général, des briefings du DP auxquels il assiste ?"
        - "A-t-il déjà vu un guide oublier ou contourner une consigne du DP ?"
        - "A-t-il déjà préparé une plongée à partir d'un sujet écrit ?"
      sait:
        - "Sait-il quels éléments du briefing du DP conditionnent la plongée du guide ?"
        - "A-t-il des idées fausses ? Par exemple : « une fois sous l'eau, c'est le guide qui décide », ou « les consignes du DP, ce sont surtout les horaires »."
      esprit:
        - "Écoute-t-il le briefing du DP avec attention, ou le vit-il comme une formalité ?"
        - "Se sent-il contraint par les consignes, ou rassuré par elles ?"
      comment: "En sortie, juste après le briefing du DP, lui demander : « Redis-moi tout ce qu'il a dit. » Puis : « Qu'est-ce qui, là-dedans, change quelque chose pour ta palanquée ? » On note les oublis et les priorités qu'il donne."
      adapter:
        - "Sa restitution est incomplète : on commence à l'étape 1, « Restituer le briefing du DP »."
        - "Il restitue tout mais ne hiérarchise pas : on passe à l'étape 2, « Trier ce qui sert au GP »."
        - "Il trie bien les consignes : on passe à l'étape 3, « Intégrer dans son plan », sur sujet tiré."
    bilan:
      situation: "l'étape 4 : épreuve 4 (évaluation), sujet tiré, 10 minutes de préparation"
      criteres:
        - "Les consignes du DP sont prises en compte dans sa conduite de palanquée."
        - "Son plan de plongée est entièrement compatible avec ces consignes."
        - "Il sait dire quelles consignes conditionnent sa plongée, et pourquoi."
      securite: []
      eca: "prévoit un parcours qui dépasse la profondeur fixée par le DP → reprendre l'étape 3"
  "S'informer auprès du DP":
    evaluer:
      question: "Le candidat sait-il ce qui lui manque pour préparer sa plongée, et ose-t-il le demander au DP ?"
      vecu:
        - "A-t-il déjà vu un guide aller chercher des informations auprès du DP avant la plongée ?"
        - "A-t-il déjà plongé avec des consignes floues ? Qu'a-t-il fait ?"
      sait:
        - "Sait-il distinguer ce qu'il demande au DP de ce qu'il décide lui-même ?"
        - "A-t-il des idées fausses ? Par exemple : « poser des questions, c'est montrer qu'on n'est pas prêt », ou « plus on pose de questions, mieux c'est »."
        - "Sait-il de quoi il a besoin : paramètres, site, conditions, niveau et matériel des plongeurs ?"
      esprit:
        - "Est-il intimidé par le DP, au point de ne rien demander ?"
        - "Préfère-t-il improviser plutôt que de s'informer ?"
      comment: "Au sec, lui remettre un sujet volontairement incomplet, sans le prévenir, et lui dire : « Prépare ta plongée. Je suis ton DP. » On note s'il repère les manques, quelles questions il pose, et dans quel ordre."
      adapter:
        - "Il ne sait pas ce qui relève du DP : on commence à l'étape 1, « Ce dont le GP a besoin »."
        - "Il connaît la liste mais ne repère pas les manques : on passe à l'étape 2, « Sujet incomplet »."
        - "Il pose les bonnes questions sans limite de temps : on passe à l'étape 3, « Pendant les 10 minutes de préparation »."
    bilan:
      situation: "l'étape 4 : épreuve 4 (évaluation), sujet tiré, demandes d'informations possibles pendant la préparation"
      criteres:
        - "Les éléments manquants et utiles sont identifiés et demandés."
        - "Il pose les questions utiles, et seulement celles-là."
        - "Les questions sont posées à temps, la préparation tient dans les 10 minutes."
      securite: []
      eca: "ne demande pas le niveau d'un plongeur absent du sujet → reprendre l'étape 2"
  "Accueillir, prendre en charge et informer la palanquée sur le déroulement de la plongée en tenant compte du niveau des plongeurs":
    evaluer:
      question: "Quelle idée le candidat se fait-il d'un bon briefing de palanquée, et que sait-il déjà en faire ?"
      vecu:
        - "Quels briefings de guide l'ont rassuré, ou au contraire laissé dans le flou ?"
        - "A-t-il déjà briefé des plongeurs, même de façon informelle ?"
        - "A-t-il déjà plongé avec un guide qui ne tenait pas compte de son niveau réel ?"
      sait:
        - "Connaît-il les éléments d'un briefing : présentation, déroulement, paramètres, mise à l'eau, signes, procédures, retour ?"
        - "A-t-il des idées fausses ? Par exemple : « un briefing complet, c'est un briefing long », ou « le niveau sur la carte dit tout du plongeur »."
        - "Connaît-il les prérogatives des plongeurs PE12, PE20 et PE40 encadrés ?"
      esprit:
        - "Est-il à l'aise pour parler devant un groupe ?"
        - "Craint-il d'oublier quelque chose, au point de réciter ?"
      comment: "Au sec, face à deux ou trois stagiaires dans le rôle de plongeurs, lui demander : « Briefe ta palanquée pour la plongée de tout à l'heure. » On note l'ordre, les oublis, le ton, et s'il pose des questions aux plongeurs."
      adapter:
        - "Son briefing est incomplet ou désordonné : on commence à l'étape 1, « La trame d'un briefing »."
        - "La trame est là mais le contenu n'est pas adapté au niveau : on passe à l'étape 2, « Briefer un niveau donné »."
        - "Il briefe bien un niveau donné sans interroger les plongeurs : on travaille l'étape 3, « Niveau réel et état de chacun »."
        - "Il est déjà à l'aise en briefing joué : on passe à l'étape 4, « En sortie réelle »."
    bilan:
      situation: "l'étape 5 : briefing de l'épreuve 4 (évaluation), sujet tiré"
      criteres:
        - "La prise en charge est rassurante et claire jusqu'à l'immersion."
        - "Le briefing est complet, ordonné et adapté au niveau réel de chaque plongeur."
        - "Les consignes du DP sont intégrées."
      securite: []
      eca: "fait le même briefing sans s'informer de l'état des plongeurs → reprendre l'étape 3"
  "Organiser et gérer la mise à l'eau en sécurité":
    evaluer:
      question: "Comment le candidat voit-il le rôle du guide au moment de la mise à l'eau de sa palanquée ?"
      vecu:
        - "Ses guides vérifiaient-ils son matériel avant la mise à l'eau ?"
        - "A-t-il déjà vu un plongeur se mettre à l'eau robinet fermé ou inflateur débranché ?"
        - "A-t-il déjà aidé un débutant à se mettre à l'eau ?"
      sait:
        - "Sait-il ce qu'on vérifie : robinets ouverts, inflateurs branchés, lest, détendeurs, instruments ?"
        - "A-t-il des idées fausses ? Par exemple : « des PE40 n'ont pas besoin d'être vérifiés », ou « le guide se met à l'eau en premier, les autres suivent »."
      esprit:
        - "Est-il gêné de vérifier le matériel d'un plongeur plus expérimenté que lui ?"
        - "Se laisse-t-il presser par l'agitation du bateau ?"
      comment: "Sur le bateau ou au bord du bassin, palanquée jouée équipée, une anomalie glissée par le moniteur (robinet fermé, inflateur débranché), lui dire : « Organise la mise à l'eau de ta palanquée. » On regarde s'il vérifie, ce qu'il repère, et l'ordre qu'il donne."
      adapter:
        - "Il ne vérifie pas le matériel ou laisse passer l'anomalie : on commence à l'étape 1, « Vérifier le matériel des plongeurs »."
        - "Il vérifie bien mais l'ordre de mise à l'eau est flou : on passe à l'étape 2, « Mise à l'eau de plongeurs confirmés »."
        - "Il organise bien des plongeurs confirmés : on travaille l'étape 3, « Mise à l'eau de débutants »."
    bilan:
      situation: "l'étape 4 : épreuve 4 (évaluation), sujet tiré"
      criteres:
        - "Le matériel de chacun est vérifié de façon systématique et rapide."
        - "L'ordre et les consignes sont clairs, l'organisation efficace."
        - "Le comportement est sûr ; l'aide est adaptée aux débutants, sans aucune mise en danger."
      securite: []
      eca: "ne contrôle pas les robinets avant la mise à l'eau → reprendre l'étape 1"
  "Organiser et gérer l'immersion en sécurité":
    evaluer:
      question: "Que fait aujourd'hui le candidat entre la mise à l'eau et le début de la descente ?"
      vecu:
        - "Comment ses guides regroupaient-ils la palanquée en surface ?"
        - "A-t-il déjà vécu une immersion désordonnée, avec un plongeur qui dérive ou descend seul ?"
        - "A-t-il déjà attendu en surface dans le clapot ou le courant ?"
      sait:
        - "Sait-il choisir entre une immersion le long du pendeur et en pleine eau selon le niveau ?"
        - "A-t-il des idées fausses ? Par exemple : « chacun descend dès qu'il est prêt », ou « s'il y a du courant, on descend vite et on se retrouve au fond »."
      esprit:
        - "Est-il pressé de descendre, ou prend-il le temps du regroupement ?"
        - "Le clapot ou le courant l'inquiètent-ils pour lui-même ?"
