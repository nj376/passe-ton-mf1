        - "10 m atteints en un seul essai, stabilisation et retour en surface en sécurité."
        - "Protocole complet : signe OK, identification, tour d'horizon, tuba hors de la bouche, signe OK en surface."
        - "Ni perte de contrôle moteur ni syncope."
      securite:
        - "Apnée toujours en binôme, un plongeur surveille depuis la surface."
        - "Pas d'hyperventilation."
        - "L'examinateur ou le moniteur est à 10 m."
