N4-guider:
  "Assurer le déroulement de la plongée dans le respect des consignes du DP":
    evaluer:
      question: "Comment le candidat conduit-il une plongée : en suivant son envie, ou en tenant les consignes et les plongeurs ?"
      vecu:
        - "A-t-il déjà vu un guide sortir des paramètres annoncés par le DP ?"
        - "Ses guides lui demandaient-ils régulièrement sa pression ?"
        - "A-t-il déjà mené un parcours en autonomie au N3 ?"
      sait:
        - "Sait-il ce qu'il doit surveiller chez chaque plongeur : consommation et désaturation ?"
        - "A-t-il des idées fausses ? Par exemple : « si le site est beau, on peut aller un peu plus loin », ou « chacun surveille son ordinateur »."
      esprit:
        - "Se laisse-t-il absorber par l'exploration ?"
        - "La responsabilité de plusieurs plongeurs le stresse-t-elle ?"
      comment: "En milieu naturel, palanquée jouée, après un court briefing, lui dire : « Conduis la plongée que tu as annoncée. » On compte ses contrôles de pression, et on regarde s'il tient le parcours et les paramètres du DP."
      adapter:
        - "Il s'écarte du parcours annoncé : on commence à l'étape 1, « Suivre le parcours annoncé »."
        - "Il tient le parcours mais ne l'ajuste pas aux plongeurs : on passe à l'étape 2, « Adapter le parcours »."
        - "Il conduit bien mais contrôle peu ses plongeurs : on travaille l'étape 3, « Surveiller les paramètres de chacun »."
    bilan:
      situation: "l'étape 4 : épreuve 4 (évaluation), sujet tiré"
      criteres:
        - "Les consignes du DP et les indications du briefing sont respectées."
        - "Le parcours est adapté aux plongeurs sans sortir des consignes du DP."
        - "Aucun plongeur ne sort de ses paramètres."
      securite:
        - "Formation dans l'espace 0-40 m sous la responsabilité d'un encadrant E3 minimum."
        - "Accoutumance progressive à la profondeur."
      eca: "ne contrôle pas la consommation des plongeurs → reprendre l'étape 3"
  "S'adapter aux situations imprévues dans le sens de la sécurité":
