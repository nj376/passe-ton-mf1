      vecu:
        - "Quels débriefings a-t-il reçus ? Étaient-ils construits, ou réduits à « c'était bien » ?"
        - "A-t-il déjà débriefé une plongée, même entre copains ou en autonomie ?"
        - "A-t-il vécu un débriefing vexant ou culpabilisant ?"
