        - "A-t-il déjà lancé un parachute au palier ?"
      sait:
        - "Sait-il sur quels éléments décider la fin de plongée : air, désaturation, consignes du DP ?"
        - "A-t-il des idées fausses ? Par exemple : « chacun suit son ordinateur », ou « on remonte quand le premier atteint sa réserve »."
        - "Connaît-il les préconisations fédérales en cas d'ordinateurs différents et les procédures de rattrapage ?"
      esprit:
        - "Est-il serein pour imposer une remontée à toute la palanquée ?"
        - "Est-il à l'aise au palier, ou absorbé par sa propre stabilisation ?"
      comment: "Au sec, lui poser un cas : « Trois plongeurs, trois ordinateurs, l'un affiche un palier et pas les autres. Que fais-tu ? » Puis, en plongée, observer quand et comment il engage la remontée."
      adapter:
        - "Il engage la remontée trop tard ou sans vérifier chacun : on commence à l'étape 1, « Décider de la fin de plongée »."
        - "Il ne sait pas gérer des ordinateurs différents : on passe à l'étape 2, « Organiser la désaturation »."
        - "Il gère bien la désaturation : on travaille l'étape 3, « Les paliers »."
        - "Il tient déjà les paliers en palanquée : on passe à l'étape 4, « Palanquée hétérogène », puis à l'étape 5, « Léger courant au palier »."
    bilan:
      situation: "l'étape 6 : épreuve 4 (évaluation), sujet tiré"
      criteres:
        - "La remontée est engagée à temps pour tous."
        - "La désaturation est gérée de façon pertinente, selon le plongeur le plus contraint."
        - "Au palier, la palanquée reste groupée et stable, paliers complets."
      securite:
        - "Parachute : jamais attaché au plongeur, ligne libre."
        - "Formation dans l'espace 0-40 m sous la responsabilité d'un encadrant E3 minimum."
        - "Accoutumance progressive à la profondeur."
