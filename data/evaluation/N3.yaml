# Cartes « Évaluer l'élève » (début) et « Bilan » (fin) des techniques du N3.
# Proposition de stagiaire (hors MFT). Rangées par identifiant de compétence, puis nom exact de la technique
# (tel qu'il figure dans data/progressions/progressions_N3.json). Les fichiers de progression ne sont pas modifiés.
#
# evaluer.question : la question directrice
# evaluer.vecu / sait / esprit : son vécu, ce qu'il sait ou croit savoir, son état d'esprit (listes)
# evaluer.comment : comment le savoir (situation d'observation)
# evaluer.adapter : où commencer selon ce qu'on a observé (liste)
# bilan.situation : la situation finale sur laquelle porte le bilan
# bilan.criteres : critères de la situation finale (liste)
# bilan.securite : points de sécurité sans compromis (liste, éventuellement vide)
# bilan.eca : exemple de note « à retravailler → étape à reprendre »
# Les curseurs, le rappel A / ECA / NT et le lien vers la compétence sont ajoutés par les gabarits.


PA40-planifier:
  "Prise en compte des directives du DP":
    evaluer:
      question: "Comment l'élève prend-il aujourd'hui en compte les consignes du DP pour préparer ses plongées autonomes ?"
      vecu:
        - "Combien de plongées autonomes a-t-il faites depuis son N2 ? Qui fixait les limites de la palanquée ?"
        - "A-t-il déjà plongé dans un club où les consignes du DP étaient différentes de celles de son club ?"
        - "Lui est-il arrivé de sortir du cadre fixé (profondeur, durée, paliers) ? Qu'en a-t-il retenu ?"
      sait:
        - "Sait-il restituer les consignes d'un briefing : durée, profondeur maximale, pression de fin de plongée, paliers, durée totale de remontée ?"
        - "A-t-il des idées fausses ? Par exemple : « en autonomie, c'est la palanquée qui décide », ou « si l'ordinateur ne demande pas de palier, on peut prolonger »."
        - "Sait-il que le DP peut resserrer le cadre, et pourquoi ?"
      esprit:
        - "Écoute-t-il le briefing, ou compte-t-il sur ses équipiers pour retenir les consignes ?"
        - "Voit-il les consignes comme une contrainte à contourner, ou comme le cadre de son autonomie ?"
      comment: "Après un briefing réel du DP, lui demander : « Quelles sont les limites de ta palanquée, et d'où viennent-elles ? » On écoute sans corriger. On note ce qui manque et ce qu'il ajoute de lui-même. C'est aussi l'étape 1, « Bilan des acquis PA20 »."
      adapter:
        - "Sa restitution est incomplète : on reprend la planification PA20 avant l'étape 2."
        - "Il restitue tout mais ne traduit pas les consignes en limites (pression de demi-tour, de remontée) : on travaille l'étape 2, « Consignes de la zone 20-40 m »."
        - "Il traduit bien les consignes mais ne remarque pas ce qui manque : on passe à l'étape 3, « Consignes incomplètes »."
        - "Il est déjà à l'aise : on passe à l'étape 4, « Contrainte forte », puis à l'étape 5."
    bilan:
      situation: "l'étape 5 : présenter et argumenter sa planification, sur plusieurs plongées aux consignes différentes (évaluation)"
      criteres:
        - "Il respecte strictement les consignes du DP."
        - "Il présente sa planification et répond aux « pourquoi » du moniteur."
        - "Chaque choix de la planification découle d'une consigne du DP, et il sait le dire."
      securite: []
      eca: "ne remarque pas qu'il manque les consignes de retour en surface → reprendre l'étape 3"
  "Compréhension de la topologie du site, orientation":
    evaluer:
      question: "Comment l'élève tient-il compte du site quand il prépare l'orientation de sa plongée ?"
      vecu:
        - "En autonomie, qui choisissait le parcours et guidait la palanquée : lui ou un équipier ?"
        - "S'est-il déjà perdu, ou a-t-il dû faire surface loin du bateau ? Pourquoi, selon lui ?"
        - "A-t-il plongé des sites variés (tombants, plateaux, épaves) ou toujours les mêmes ?"
      sait:
        - "Sait-il lire un croquis de site et y repérer le relief, les zones de profondeur et le courant habituel ?"
        - "A-t-il des idées fausses ? Par exemple : « le compas suffit partout », ou « le parcours, on le décide au fond »."
        - "Sait-il dire quand s'orienter avec le milieu et quand avec un instrument ?"
      esprit:
        - "Prépare-t-il son parcours avant la plongée, ou improvise-t-il au fond ?"
        - "Est-il trop sûr de son sens de l'orientation, ou au contraire dépendant de ses équipiers ?"
      comment: "À terre, devant le croquis d'un site et les informations du DP, lui demander : « Montre-moi par où tu passerais et comment tu retrouverais le bateau. » On écoute ses raisons sans corriger. L'étape 1, « Bilan des acquis PA20 », complète l'observation dans l'eau."
      adapter:
        - "Le bilan PA20 montre des lacunes au compas : on les reprend avant l'étape 2."
        - "Il ne tire rien du croquis : on commence à l'étape 2, « Lire le site »."
        - "Il lit le site mais choisit ses moyens d'orientation au hasard : on passe à l'étape 3, « Choisir ses moyens d'orientation »."
        - "Il planifie déjà bien sur un site connu : on passe à l'étape 4, « Du plan au terrain », puis à l'étape 5, « Site inconnu »."
    bilan:
      situation: "l'étape 6 : présenter et argumenter, sur plusieurs plongées dans la zone 20-40 m et des sites variés (évaluation)"
      criteres:
        - "Les contraintes du site sont prises en compte dans sa planification."
        - "Ses moyens d'orientation sont justifiés pour chaque partie du parcours."
        - "Il le fait sur des sites variés, y compris inconnus."
      securite:
        - "La plongée de bilan se fait en zone peu profonde, avant toute accoutumance à la profondeur."
        - "La profondeur est augmentée progressivement d'une plongée à l'autre."
        - "L'encadrant E3 reste responsable de la palanquée en formation."
      eca: "prend le compas pour tout le parcours sans regarder le site → reprendre l'étape 3"
  "Détermination du profil de la plongée et des différentes procédures en immersion":
    evaluer:
      question: "Comment l'élève construit-il aujourd'hui le profil de ses plongées, et comment anticipe-t-il les imprévus ?"
      vecu:
        - "A-t-il déjà fait des plongées avec paliers obligatoires ? Les avait-il prévus ?"
        - "Utilise-t-il le mode planification de son ordinateur, ou ne l'a-t-il jamais ouvert ?"
        - "A-t-il déjà terminé une plongée avec moins d'air que prévu ? Comment s'en est-il rendu compte ?"
      sait:
        - "Sait-il calculer une consommation et une autonomie, en l/min et en bar/min ?"
        - "A-t-il des idées fausses ? Par exemple : « on descend au plus profond à la fin, pour voir », ou « l'ordinateur s'occupe des paliers, inutile de les prévoir »."
        - "Sait-il que des ordinateurs différents peuvent donner des paliers différents ?"
      esprit:
        - "La planification lui semble-t-elle utile, ou une formalité scolaire ?"
        - "Est-il à l'aise avec les calculs, ou les redoute-t-il ?"
      comment: "À terre, sur un cas concret de plongée à 20 m, lui demander : « Propose-moi un profil, et dis-moi combien d'air il te faut. » Puis : « Et si ton équipier consomme plus que prévu ? » On écoute sans corriger. C'est l'étape 1, « Bilan des acquis PA20 », prolongée par une question sur l'imprévu."
      adapter:
        - "Son calcul de base est faux : on le reprend avec lui avant l'étape 2."
        - "Il calcule juste mais son profil n'est pas adapté à la zone : on travaille l'étape 2, « Profil dans la zone 20-40 m », puis l'étape 3."
        - "Profil et calculs sont justes : on passe à l'étape 4, « Plusieurs moyens de désaturation »."
        - "Il n'a rien prévu pour l'imprévu : on insiste sur l'étape 5, « Retour en surface ordinaire et avec incident »."
    bilan:
      situation: "l'étape 6 : présenter et argumenter la planification complète d'une plongée entre 20 et 40 m (évaluation)"
      criteres:
        - "Sa planification est complète : profil, calculs, règle de désaturation commune, procédures de retour."
        - "Ses calculs de consommation et d'autonomie sont adaptés à la zone."
        - "Chaque choix est argumenté, sur plusieurs plongées réelles et des situations variées."
      securite: []
      eca: "ne prévoit rien si un ordinateur s'arrête → reprendre l'étape 5"

PA40-autonomie:
  "Orientation":
    evaluer:
      question: "Comment l'élève s'oriente-t-il aujourd'hui en autonomie, et que devient son orientation quand la profondeur augmente ?"
      vecu:
        - "En plongée autonome, est-ce lui qui guide la palanquée ? Sur quels sites ?"
        - "A-t-il déjà plongé vers 30 ou 40 m ? A-t-il eu du mal à se repérer ou à lire son compas ?"
        - "A-t-il déjà plongé avec une visibilité réduite ou du courant ?"
      sait:
        - "Sait-il s'orienter avec le relief, la lumière, le courant et les points remarquables ?"
        - "A-t-il des idées fausses ? Par exemple : « la narcose, ça ne me fait rien », ou « avec un compas, on ne peut pas se perdre »."
        - "Sait-il que la narcose peut altérer son jugement ?"
      esprit:
        - "Est-il confiant, voire trop confiant, dans son sens de l'orientation ?"
        - "Accepte-t-il de dire qu'il ne sait plus où il est ?"
      comment: "L'étape 1, « Bilan des acquis PA20 », sert d'observation : aller-retour au compas et court trajet en zone peu profonde. Au retour, lui demander : « Comment savais-tu où était le bateau ? » On écoute ce qu'il a utilisé : le compas seul, ou aussi le milieu."
      adapter:
        - "Le bilan échoue : on reprend la progression PA20."
        - "Il ne s'appuie que sur le compas : on travaille l'étape 2, « S'orienter avec le milieu »."
        - "Il combine déjà milieu et instrument en zone peu profonde : on passe à l'étape 3, puis à l'étape 4, « Vers 40 m »."
        - "Il s'est déjà senti perdu en profondeur : à l'étape 4, on garde un plan d'orientation simple et on augmente la profondeur très progressivement."
    bilan:
      situation: "l'étape 6 : proche de 40 m, au moins deux situations différentes (évaluation)"
      criteres:
        - "Il rejoint efficacement la zone d'intérêt."
        - "Il sait se situer à tout moment."
        - "Il revient à proximité du bateau."
      securite:
        - "Accoutumance progressive à la profondeur, dans l'espace 0-40 m avec un E3 minimum."
        - "La narcose peut altérer le jugement : le plan d'orientation reste simple."
        - "Les conditions de plongée restent celles que le DP juge compatibles."
      eca: "perd son cap quand la visibilité baisse → reprendre l'étape 5"
  "Évolution subaquatique":
    evaluer:
      question: "Comment l'élève vit-il aujourd'hui la co-responsabilité dans une palanquée autonome ?"
      vecu:
        - "Combien de plongées autonomes a-t-il faites ? Avec des équipiers réguliers ou différents ?"
        - "A-t-il déjà perdu un équipier de vue, ou été perdu par lui ? Qu'a-t-il fait ?"
        - "A-t-il déjà vécu un imprévu en autonomie : froid, essoufflement, courant, panne ?"
      sait:
        - "Connaît-il la narcose, le froid, l'essoufflement et l'accident de désaturation, et leur lien avec la profondeur ?"
        - "A-t-il des idées fausses ? Par exemple : « chacun gère son air », ou « le parachute, c'est seulement quand on dérive »."
        - "Sait-il ce qu'est un profil inversé ou un yoyo, et pourquoi on les évite ?"
      esprit:
        - "Surveille-t-il ses équipiers, ou plonge-t-il pour lui-même ?"
        - "Ose-t-il proposer d'écourter une plongée, ou suit-il le groupe ?"
      comment: "L'étape 1, « Bilan des acquis PA20 », sert d'observation : plongée en autonomie à 20 m, encadrant dans la palanquée. On regarde sans intervenir la fréquence des échanges, la surveillance et le groupement. Au débriefing, lui demander : « Qu'aurais-tu fait si ton équipier avait eu froid ? »"
      adapter:
        - "Palanquée dispersée, peu d'échanges : on reste en zone peu profonde et on consolide avant l'étape 2."
        - "La cohésion est bonne à 20 m : on passe à l'étape 2, « Communication et surveillance vers 40 m »."
        - "Il hésite à décider face à un imprévu : on insiste sur l'étape 3, « Imprévu humain », et sur l'étape 4."
        - "Il fait des yoyos ou oublie l'arrêt à 3 m : on travaille l'étape 5 dès les premières plongées."
    bilan:
      situation: "l'étape 6 : proche de 40 m, au moins deux situations différentes (évaluation)"
      criteres:
        - "Communication, surveillance et cohésion de la palanquée sont maintenues."
        - "Les imprévus sont gérés."
        - "Ses comportements sont adaptés à la sécurité de la palanquée."
      securite:
        - "Accoutumance progressive, E3 minimum dans la palanquée."
        - "Jamais attaché au parachute, ligne libre : il lâche s'il se sent entraîné."
      eca: "oublie l'arrêt et le tour d'horizon à 3 m → reprendre l'étape 5"
  "Désaturation":
    evaluer:
      question: "Que sait l'élève de son ordinateur, et comment gère-t-il ses paliers en palanquée ?"
      vecu:
        - "A-t-il son propre ordinateur ? Depuis quand, et en a-t-il lu le mode d'emploi ?"
        - "A-t-il déjà fait des paliers obligatoires ? Une remontée trop rapide, une alarme ?"
        - "A-t-il plongé avec des équipiers dont l'ordinateur donnait d'autres paliers ? Qu'a fait la palanquée ?"
      sait:
        - "Sait-il lire durée, profondeur, durée sans palier, paliers, durée de remontée et alarmes ?"
        - "A-t-il des idées fausses ? Par exemple : « l'ordinateur me protège à coup sûr », ou « chacun suit son ordinateur, même si on se sépare »."
        - "Connaît-il, même sommairement, le principe d'un modèle de désaturation ?"
      esprit:
        - "Fait-il aveuglément confiance à son ordinateur, ou s'en méfie-t-il ?"
        - "Les paliers l'inquiètent-ils, ou les prend-il à la légère ?"
      comment: "Au sec, sur son ordinateur, lui demander : « Explique-moi ce que tu lis, et ce que tu ferais si cet écran s'affichait. » C'est l'étape 1, « Bilan des acquis PA20 ». On ajoute une ou deux captures d'écran d'alarmes pour voir comment il réagit."
      adapter:
        - "Il ne lit pas tous les paramètres : on les reprend, puis on travaille l'étape 2, « Maîtriser son ordinateur »."
        - "Il lit et explique son ordinateur : on passe à l'étape 3, « Paliers obligatoires dans la zone 20-40 m »."
        - "Il ne sait pas quoi faire avec des ordinateurs différents : on travaille l'étape 4, « Plusieurs moyens de désaturation »."
        - "Il hésite devant les alarmes : on revient régulièrement sur l'étape 5, « Cas concrets et captures d'écran »."
    bilan:
      situation: "l'étape 6 : proche de 40 m, au moins deux situations différentes, avec cas concrets et captures d'écran (évaluation)"
      criteres:
        - "Vitesse de remontée, paliers et cohésion de la palanquée sont maîtrisés."
        - "La diversité des moyens de désaturation est prise en compte."
        - "Ses analyses de cas concrets et de captures d'écran sont justes."
      securite:
        - "Accoutumance progressive, E3 minimum."
        - "Vigilance accrue sur la gestion des paliers."
      eca: "suit son propre ordinateur à la remontée sans tenir compte de la règle commune → reprendre l'étape 4"

PA40-assistance:
  "Observation, compréhension et réaction face à un incident":
    evaluer:
      question: "Avec quel niveau d'assistance l'élève arrive-t-il, et que sait-il des difficultés propres à la profondeur ?"
      vecu:
        - "Quand a-t-il travaillé l'assistance pour la dernière fois ? Depuis quelle profondeur ?"
        - "A-t-il déjà vu ou vécu une vraie difficulté en plongée : essoufflement, narcose, panique ?"
        - "A-t-il une activité physique régulière ? A-t-il déjà nagé longtemps capelé en surface ?"
      sait:
        - "Connaît-il les manifestations d'une difficulté sans signe : perte de vigilance, ventilation anormale, agitation ?"
        - "A-t-il des idées fausses ? Par exemple : « on remonte toujours le plus vite possible, jusqu'en surface », ou « à la palme, c'est plus sûr qu'avec les gilets »."
        - "Sait-il pourquoi on marque un arrêt entre 5 et 3 m ?"
      esprit:
        - "Se sent-il capable de prendre en charge un équipier en profondeur ?"
        - "Agit-il avec précipitation, ou tarde-t-il à intervenir ?"
      comment: "L'étape 1, « Bilan des acquis PA20 », sert d'observation : assistance intégrale depuis 20 m, le moniteur dans le rôle de l'assisté. On regarde sans corriger l'interprétation, la prise en charge, la vitesse et l'arrêt. Au débriefing, lui demander : « Qu'est-ce qui changerait à 40 m ? »"
      adapter:
        - "L'assistance depuis 20 m n'est pas sûre : on reprend la progression PA20."
        - "Il assiste bien mais réagit tard aux signes discrets : on travaille l'étape 2, « Manifestations sans signe en profondeur »."
        - "Il est à l'aise depuis 20 m : on passe à l'étape 3, « Assistance depuis 30 m », puis à l'étape 4."
        - "Sa condition physique est juste : on commence tôt l'étape 5, « Vers 300 m de nage capelée », en parallèle."
    bilan:
      situation: "l'étape 6 : à 40 m et 300 m capelé (évaluation)"
      criteres:
        - "Interprétation juste, prise en charge rapide et efficace."
        - "Remontée régulière, arrêt marqué entre 5 et 3 m, gilets privilégiés, sortie d'eau sécurisée."
        - "Au moins deux situations différentes à 40 m, chacune réalisée intégralement au moins deux fois."
        - "300 m de nage capelée, non chronométrée, en bonnes conditions physiques."
      securite:
        - "L'assisté est le moniteur : il contrôle la remontée et peut la freiner ou l'interrompre à tout moment."
        - "Accoutumance progressive, E3 minimum."
        - "Gilet gonflé en surface pendant la nage capelée."
      eca: "ne régule pas sa vitesse après 30 m → reprendre l'étape 4"

PE60-profondeur:
  "Stabilisation":
    evaluer:
      question: "Comment l'élève se stabilise-t-il aujourd'hui, et a-t-il déjà ressenti l'effet de la profondeur sur son équilibre ?"
      vecu:
        - "Jusqu'à quelle profondeur a-t-il plongé ? Combien de fois au-delà de 30 m ?"
        - "A-t-il déjà eu du mal à s'arrêter à la descente, ou à tenir un palier ?"
        - "A-t-il déjà ressenti la narcose, le froid ou une consommation plus forte en profondeur ?"
      sait:
        - "Sait-il pourquoi il faut injecter plus souvent en descendant, et anticiper ses purges en remontant ?"
        - "A-t-il des idées fausses ? Par exemple : « en profondeur, on palme pour garder son niveau », ou « plus de lest, c'est plus facile pour descendre »."
        - "Connaît-il les risques qui augmentent avec la profondeur : consommation, essoufflement, narcose, froid, désaturation ?"
      esprit:
        - "Est-il impatient d'aller plus profond, ou appréhende-t-il les 40 m ?"
        - "Reconnaît-il ses difficultés de stabilisation, ou les attribue-t-il au matériel ?"
      comment: "L'étape 1, « Bilan des acquis PE40 », sert d'observation : stabilisation à la descente, au fond et au palier, jusqu'à 20 m puis 30 m. On regarde sans corriger s'il anticipe ses injections et ses purges, et s'il palme pour se rattraper. Au retour, lui demander : « À quel moment as-tu senti que tu n'étais plus équilibré ? »"
      adapter:
        - "Sa stabilisation n'est pas encore efficace à 20 ou 30 m : on la consolide avant d'augmenter la profondeur."
        - "Il est stable à 30 m : on passe à l'étape 2, « Descente équilibrée vers 40 m »."
        - "Il descend bien mais s'emballe à la remontée : on insiste sur l'étape 4, « Remontée et palier depuis la profondeur »."
        - "Il appréhende la profondeur : à l'étape 2, on augmente la profondeur encore plus progressivement."
    bilan:
      situation: "l'étape 5 : jusqu'à 40 m, puis vers 60 m (évaluation)"
      criteres:
        - "À la descente, il arrive au fond équilibré, sans palmer pour se rattraper."
        - "Au fond, son niveau est stable et il évolue sans effort."
        - "À la remontée et au palier, sa vitesse est régulière et ses paliers sont tenus à la bonne profondeur."
      securite:
        - "Accoutumance progressive. Enseignement et validation dans l'espace 0-40 m par un E3 minimum."
        - "Au-delà de 40 m, uniquement encadré par un E4, de façon progressive."
      eca: "s'emballe à la remontée et dépasse la profondeur de palier → reprendre l'étape 4"
  "Mise en œuvre de l'ensemble des autres techniques":
    evaluer:
      question: "Comment les techniques du PE40 de l'élève tiennent-elles quand la profondeur augmente ?"
      vecu:
        - "Depuis son N2 ou son PE40, a-t-il plongé régulièrement vers 30 ou 40 m ?"
        - "A-t-il déjà été essoufflé en profondeur ? Qu'a-t-il fait ?"
        - "A-t-il déjà dû aider un équipier, ou être aidé, lors d'une plongée réelle ?"
      sait:
        - "Connaît-il les signes à utiliser pour la narcose, la consommation et la désaturation ?"
        - "A-t-il des idées fausses ? Par exemple : « les paliers, c'est le GP qui s'en occupe », ou « signaler la narcose, c'est avouer une faiblesse »."
        - "Sait-il quels paramètres communiquer au GP et restituer au DP après la plongée ?"
      esprit:
        - "Signale-t-il spontanément son ressenti, ou attend-il qu'on le lui demande ?"
        - "Minimise-t-il ses sensations (narcose, froid) pour ne pas écourter la plongée ?"
      comment: "L'étape 1, « Bilan des acquis PE40 », sert d'observation : plongée jusqu'à 30 m, techniques enchaînées. On regarde sa ventilation, la fréquence de ses échanges et sa réaction au relai, sans intervenir. Au débriefing, lui demander de restituer ses paramètres et son ressenti."
      adapter:
        - "Une technique du PE40 n'est pas maîtrisée : on la reprend avant d'aller plus profond."
        - "Sa ventilation s'accélère dès qu'il fait un effort : on travaille l'étape 2, « Ventilation et déplacement en profondeur »."
        - "Il ne communique que si on l'interroge : on insiste sur l'étape 3, « Communication spécifique »."
        - "Tout est maîtrisé à 30 m : on passe à l'étape 4, « Relai en profondeur », puis à l'étape 5."
    bilan:
      situation: "l'étape 6 : jusqu'à 40 m, puis vers 60 m (évaluation)"
      criteres:
        - "Les techniques sont maîtrisées, avec des comportements identiques à ceux du PE40."
        - "Les contraintes de la zone profonde sont prises en compte."
        - "La théorie est intégrée à la pratique."
      securite:
        - "Accoutumance progressive, E3 minimum."
        - "Pour le relai, l'assisté est le moniteur."
        - "Au-delà de 40 m, uniquement encadré par un E4, de façon progressive."
      eca: "ne signale pas sa consommation au GP sans qu'on le lui demande → reprendre l'étape 3"

PA60-organiser:
  "Choix du site":
    evaluer:
      question: "Comment l'élève choisirait-il aujourd'hui un site de plongée, s'il devait le faire seul ?"
      vecu:
        - "A-t-il déjà choisi lui-même un site, ou a-t-il toujours plongé là où le club allait ?"
        - "A-t-il déjà vu une plongée annulée ou déplacée à cause de la météo ? Sait-il pourquoi ?"
        - "Pratique-t-il une activité nautique (voile, navigation) qui l'a habitué à lire la météo ?"
      sait:
        - "Sait-il lire un bulletin météo marine : vent, houle, courant, évolution dans la journée ?"
        - "A-t-il des idées fausses ? Par exemple : « s'il fait beau, on peut plonger partout », ou « on peut mouiller où on veut »."
        - "Sait-il où trouver les zones protégées ou interdites et les restrictions de mouillage ?"
      esprit:
        - "Voit-il cette compétence comme utile, ou comme l'affaire du DP ?"
        - "Ose-t-il renoncer à un site, ou cherche-t-il à plonger coûte que coûte ?"
      comment: "À terre, avec le bulletin météo du jour et deux ou trois sites qu'il connaît, lui demander : « Où plongerais-tu aujourd'hui, et pourquoi ? » On écoute ses raisons sans corriger : météo, site, réglementation, palanquée."
      adapter:
        - "Il ne sait pas lire un bulletin : on commence à l'étape 1, « Lire la météo »."
        - "Il lit la météo mais ne la relie pas au site : on passe à l'étape 2, « Analyser un site connu »."
        - "Il oublie la réglementation : on travaille l'étape 3, « Conditions réglementaires du site »."
        - "Il choisit et justifie déjà bien : on passe à l'étape 4, puis à l'étape 5, « Site inconnu »."
    bilan:
      situation: "l'étape 6 : dans 2 ou 3 situations, au sein d'une organisation complète de plongée (évaluation)"
      criteres:
        - "Le choix du site est faisable et pertinent."
        - "Il le justifie par la météo, le site, la réglementation et la palanquée."
        - "Il le fait dans 2 ou 3 situations différentes au minimum."
      securite: []
      eca: "choisit un site sans vérifier les restrictions de mouillage → reprendre l'étape 3"
  "Organisation des conditions de la plongée":
    evaluer:
      question: "Que perçoit l'élève de l'organisation qui rend une plongée possible et sûre ?"
      vecu:
        - "A-t-il déjà aidé à organiser une sortie : surveillance en surface, horaires, rotation des palanquées ?"
        - "A-t-il plongé depuis différentes embarcations, ou depuis le bord ?"
        - "A-t-il déjà vu une organisation défaillante : bateau sans surveillance, palanquées qui attendent ?"
      sait:
        - "Sait-il pourquoi quelqu'un reste en surface pendant la plongée ?"
        - "A-t-il des idées fausses ? Par exemple : « si la météo était bonne hier, inutile de revérifier », ou « l'organisation, c'est l'affaire du DP »."
        - "Sait-il qu'une embarcation doit être conforme à la réglementation ?"
      esprit:
        - "Regarde-t-il comment la sortie est organisée, ou se contente-t-il de plonger ?"
        - "Se sent-il légitime pour proposer une organisation à d'autres plongeurs ?"
      comment: "Au retour d'une sortie, lui demander : « Raconte-moi comment la sortie était organisée, et pourquoi. » On écoute ce qu'il a remarqué : surveillance en surface, ordre des palanquées, horaires, météo. C'est le point de départ de l'étape 1, « Observer une organisation »."
      adapter:
        - "Il n'a rien remarqué : on commence à l'étape 1, « Observer une organisation »."
        - "Il décrit bien l'organisation mais ne revérifie pas la météo : on passe à l'étape 2, « Météo le jour même »."
        - "Il ne sait pas ce qui rend une embarcation conforme : on travaille l'étape 3, « Vérifier l'embarcation »."
        - "Il a déjà aidé un DP : on passe à l'étape 4, « Choisir les modalités de plongée »."
    bilan:
      situation: "l'étape 5 : dans 2 ou 3 situations, organisation complète de plongée (évaluation)"
      criteres:
        - "L'organisation des conditions de la plongée est faisable et pertinente."
        - "La sécurité en surface est assurée en permanence."
        - "Il le fait dans 2 ou 3 situations différentes au minimum."
      securite:
        - "Pendant la formation, un encadrant qualifié reste présent et responsable."
      eca: "ne prévoit personne en surface pendant une rotation → reprendre l'étape 4"
  "Sécurisation de l'activité":
    evaluer:
      question: "Que sait l'élève des moyens qui sécurisent une plongée, sur le bateau comme à terre ?"
      vecu:
        - "A-t-il son RIFAP ? A-t-il déjà vu sortir le matériel d'oxygénothérapie ?"
        - "A-t-il déjà vu remplir une fiche de sécurité, ou hisser le pavillon alpha ?"
        - "A-t-il déjà vu une plongée arrêtée parce que le vent se levait ?"
      sait:
        - "Sait-il ce que doit contenir le matériel de secours, et comment donner l'alerte ?"
        - "A-t-il des idées fausses ? Par exemple : « la fiche de sécurité se remplit à la fin, de mémoire », ou « une fois sur le site, on plonge quoi qu'il arrive »."
        - "Sait-il ce que signifie le pavillon alpha ?"
      esprit:
        - "Voit-il la sécurité comme une routine administrative, ou comme une responsabilité ?"
        - "Est-il prêt à arrêter une plongée qui ne lui semble plus sûre ?"
      comment: "Avant une sortie, sur le bateau ou au local, lui demander : « Montre-moi ce qui permet de faire face à un accident ici. » On l'observe chercher le matériel de secours et les moyens d'alerte, et on écoute ce qu'il dit de la fiche de sécurité et du pavillon."
      adapter:
        - "Il ne trouve pas le matériel ou ne sait pas alerter : on commence à l'étape 1, « Matériel de secours et communication »."
        - "Il connaît le matériel mais n'a jamais tenu de fiche : on passe à l'étape 2, « Rédiger la fiche de sécurité », puis à l'étape 3."
        - "Il maîtrise ces outils mais hésite à renoncer : on insiste sur l'étape 4, « Adapter aux conditions »."
    bilan:
      situation: "l'étape 5 : dans 2 ou 3 situations, organisation complète de plongée (évaluation)"
      criteres:
        - "La sécurisation de l'activité est faisable et pertinente."
        - "Il fait preuve de rigueur et respecte la réglementation."
        - "Il le fait dans 2 ou 3 situations différentes au minimum."
      securite:
        - "Pendant la formation, un encadrant qualifié reste présent et responsable."
      eca: "remplit la fiche de sécurité de mémoire après la plongée → reprendre l'étape 2"

PA60-autonomie:
  "Orientation":
    evaluer:
      question: "Comment l'orientation de l'élève résiste-t-elle à la profondeur et à la narcose ?"
      vecu:
        - "Combien de plongées a-t-il faites vers 40 m depuis son PA40 ? Est-ce lui qui guidait ?"
        - "S'est-il déjà senti confus, ou lent à lire son compas, en profondeur ?"
        - "A-t-il plongé des sites où l'on part profond pour revenir en remontant le long du relief ?"
      sait:
        - "Sait-il pourquoi le plan d'orientation doit rester simple en zone profonde ?"
        - "A-t-il des idées fausses ? Par exemple : « je connais le site, je ne peux pas me perdre », ou « la narcose, je la gère »."
        - "Sait-il ce que fait la palanquée au moindre signe de narcose ?"
      esprit:
        - "Est-il prudent, ou attiré par la profondeur au point d'en oublier son parcours ?"
        - "Accepte-t-il de simplifier son parcours, ou veut-il tout voir ?"
      comment: "L'étape 1, « Bilan des acquis PA40 », sert d'observation : parcours varié vers 40 m, milieu et instrument. Avant la plongée, lui demander son plan d'orientation ; au retour, lui faire comparer le prévu et le réalisé. On écoute s'il a tenu compte de la narcose."
      adapter:
        - "Le bilan échoue : on reprend la progression PA40."
        - "Son plan est trop complexe pour la profondeur : on travaille l'étape 2, « S'orienter en zone profonde »."
        - "Il gère mal son retour en remontant : on passe à l'étape 3, « Profil avec grande variation de profondeur »."
        - "Il est à l'aise vers 40 m : on passe à l'étape 4, « Entre 40 et 60 m, encadré »."
    bilan:
      situation: "l'étape 5 : au moins deux situations différentes (évaluation)"
      criteres:
        - "Il maîtrise son itinéraire dans au moins deux situations différentes."
        - "Son comportement est adapté aux exigences de la zone 40-60 m."
        - "Si l'évaluation se fait à 40 m maximum, c'est ce comportement de la zone 40-60 m qui est attendu."
      securite:
        - "Accoutumance progressive. Au moindre signe de narcose, la palanquée remonte de quelques mètres."
        - "Au-delà de 40 m, uniquement sous la responsabilité d'un E4, de façon progressive."
      eca: "prévoit un parcours trop compliqué pour la profondeur → reprendre l'étape 2"
  "Évolution subaquatique":
    evaluer:
      question: "Comment l'élève assume-t-il la co-gestion de la palanquée quand les risques augmentent avec la profondeur ?"
      vecu:
        - "Combien de plongées autonomes a-t-il faites vers 40 m ? Avec quels équipiers ?"
        - "A-t-il déjà ressenti la narcose, ou l'a-t-il repérée chez un équipier ?"
        - "A-t-il déjà dû écourter une plongée profonde ? Qui a pris la décision ?"
      sait:
        - "Sait-il calculer sa consommation en profondeur et au palier, en l/min et en bar/min ?"
        - "A-t-il des idées fausses ? Par exemple : « la réserve habituelle suffit, même avec des paliers longs », ou « je suis moins sensible que les autres à la narcose »."
        - "Connaît-il les premiers signes de narcose, de froid et d'essoufflement ?"
      esprit:
        - "Est-il prêt à décider avec ses équipiers, ou attend-il qu'un autre décide ?"
        - "Sa confiance en lui l'empêche-t-elle de signaler ses propres signes ?"
      comment: "L'étape 1, « Bilan des acquis PA40 », sert d'observation : plongée en autonomie vers 40 m. On regarde sans intervenir la fréquence des contrôles d'air et la surveillance mutuelle. Au débriefing, lui demander : « À quelle pression aviez-vous prévu de remonter, compte tenu des paliers ? »"
      adapter:
        - "Cohésion ou gestion des imprévus fragile vers 40 m : on reprend la progression PA40."
        - "Ses seuils d'air ne tiennent pas compte des paliers : on travaille l'étape 2, « Consommation en zone profonde »."
        - "Il ne repère pas les signes chez ses équipiers : on insiste sur l'étape 3, « Risques accrus », puis sur l'étape 4."
        - "Il est à l'aise vers 40 m : on passe à l'étape 5, « Entre 40 et 60 m, encadré »."
    bilan:
      situation: "l'étape 6 : au moins deux situations différentes (évaluation)"
      criteres:
        - "Il porte attention à la consommation et à la désaturation."
        - "Il prévient et repère les risques accrus de la zone profonde."
        - "Il co-gère la palanquée avec un comportement adapté à la zone 0-60 m, même si l'évaluation se fait à 40 m maximum."
      securite:
        - "Au-delà de 40 m, uniquement sous la responsabilité d'un E4, de façon progressive."
      eca: "ne relève pas ses seuils de remontée pour tenir compte des paliers → reprendre l'étape 2"
  "Désaturation":
    evaluer:
      question: "Comment l'élève prépare-t-il et gère-t-il la désaturation d'une plongée profonde ?"
      vecu:
        - "A-t-il déjà fait des paliers longs ? Avec combien d'air est-il arrivé en surface ?"
        - "A-t-il modifié les réglages de son ordinateur (conservatisme, GF) ? Pourquoi ?"
        - "A-t-il plongé profond avec des équipiers aux ordinateurs différents ?"
      sait:
        - "Sait-il utiliser le mode planification de son ordinateur pour une plongée profonde ?"
        - "A-t-il des idées fausses ? Par exemple : « moins de conservatisme, c'est plus de plongée sans plus de risque », ou « l'air des paliers se gère au fur et à mesure »."
        - "Connaît-il les valeurs de GF conseillées pour la plongée à l'air ?"
      esprit:
        - "Fait-il confiance à son ordinateur sans rien planifier, ou anticipe-t-il ?"
        - "Les paliers longs l'inquiètent-ils, ou les banalise-t-il ?"
      comment: "Au sec, lui demander de planifier sur son ordinateur une plongée profonde, puis d'expliquer les paliers obtenus et l'air nécessaire jusqu'à la surface. On lui montre ensuite une ou deux captures d'écran. C'est l'étape 1, « Bilan des acquis PA40 », avant la plongée avec paliers."
      adapter:
        - "Ses analyses ou ses paliers jusqu'à 40 m ne sont pas maîtrisés : on reprend la progression PA40."
        - "Il ne connaît pas le mode planification : on travaille l'étape 2, « Ordinateur et mode planification »."
        - "Il planifie les paliers mais pas l'air nécessaire : on passe à l'étape 3, « Planifier la désaturation d'une plongée profonde »."
        - "Il planifie déjà bien : on passe à l'étape 4, « Paliers importants en palanquée », puis à l'étape 5."
    bilan:
      situation: "l'étape 6 : au moins deux situations différentes (évaluation)"
      criteres:
        - "La planification et la gestion de la désaturation sont maîtrisées."
        - "La diversité des moyens de désaturation est prise en compte."
        - "Son comportement est adapté à la zone 40-60 m, même si l'évaluation se fait à 40 m maximum."
      securite:
        - "Accoutumance progressive. Au-delà de 40 m, sous la responsabilité d'un E4."
      eca: "ne prévoit pas de réserve d'air pour les paliers → reprendre l'étape 3"

N3-milieu:
  "Aisance aquatique":
    evaluer:
      question: "Comment l'élève se comporte-t-il aujourd'hui avec le milieu, et que sait-il de ce qu'il y voit ?"
      vecu:
        - "Plonge-t-il plutôt pour la profondeur, ou pour observer ?"
        - "A-t-il déjà plongé sur un tombant, dans le courant, ou avec une lampe ?"
        - "A-t-il déjà vu nourrir des poissons ou toucher le vivant en plongée ? Qu'en pense-t-il ?"
      sait:
        - "Sait-il nommer les espèces courantes de ses sites habituels ?"
        - "A-t-il des idées fausses ? Par exemple : « toucher une gorgone, ce n'est pas grave », ou « éclairer un animal de près ne le dérange pas »."
        - "Connaît-il la charte internationale du plongeur responsable ?"
      esprit:
        - "Est-il curieux du vivant, ou indifférent ?"
        - "Prend-il le temps d'observer, ou cherche-t-il surtout à aller plus profond ?"
      comment: "L'étape 1, « Bilan des acquis PA20 », sert d'observation : plongée en milieu naturel. On regarde sans intervenir ses contacts avec le fond, son palmage et sa distance au vivant. Au retour, lui demander : « Qu'as-tu vu ? Peux-tu me le nommer ? »"
      adapter:
        - "Il touche le fond ou soulève du sédiment : on consolide sa stabilisation, puis on travaille l'étape 3, « Stable sur un tombant ou dans le courant »."
        - "Il est discret mais éblouit la faune avec sa lampe : on passe à l'étape 2, « Discrétion en zone profonde »."
        - "Il nomme peu d'espèces : on développe l'étape 4, « Développer son observation », au fil des plongées."
    bilan:
      situation: "l'étape 5 : comportement en plongée, en milieu naturel (évaluation)"
      criteres:
        - "Son comportement est respectueux et responsable : aucun contact, faune observée sans la déranger."
        - "Il décrit et nomme les espèces fréquentes rencontrées."
        - "Il refuse le nourrissage."
      securite: []
      eca: "soulève du sédiment en se stabilisant sur un tombant → reprendre l'étape 3"
