# Parcours jusqu’au MF1 : frise de la page d’accueil et page Examen.
# Source unique : à mettre à jour à chaque révision du MFT MF1 (champs source et version_mft).
# Vérifié dans le MFT MF1 FFESSM, version juillet 2026 : architecture (p. 2), règles du cursus et allègements (p. 4),
# stage initial (p. 6), module 20-40 m (p. 13), module capacitaire (p. 18), stage en situation (p. 26),
# stage final (p. 33), accès à l’examen (p. 35), notation (p. 40), attestation IPD (p. 41).
# Textes : tutoiement, aucun tiret cadratin. Les « ** » mettent en gras (Markdown).

source: "MFT MF1, FFESSM"
version_mft: "juillet 2026"
mention_source: "Source : MFT MF1, FFESSM, version juillet 2026. En cas de doute, c’est le MFT et ta CTR qui font foi."

intro: "Le MF1 se prépare en plusieurs étapes, sur trois ans maximum. Selon les diplômes que tu as déjà, deux chemins sont possibles au départ, puis ils se rejoignent."

# Étape 0
conditions:
  n: "0"
  titre: "Avant de commencer"
  resume: "Ce qu’il te faut pour entrer en formation."
  points:
    - "Licence FFESSM en cours de validité"
    - "18 ans révolus au début du stage initial"
    - "Être francophone"
    - "Guide de Palanquée Niveau 4 de la FFESSM, ou GP associé FFESSM, ou Niveau 4 ANMP, ou BPJEPS"
    - "Carte RIFA Plongée de la FFESSM"
    - "Contrôle médical : selon les préconisations du chapitre « Généralités » du MFT"
  anticiper: "Pour te présenter à l’examen, il te faudra aussi le **permis bateau** (option côtière minimum). Mieux vaut le passer pendant le cursus que le découvrir au dernier moment."

# Étape 1 : deux filières, qui se rejoignent au stage en situation
filieres:
  - id: classique
    filiere: "Filière classique"
    pour: "Pour les titulaires du GP-N4 (ou GP-N4 associé FFESSM, N4 ANMP, BPJEPS). Tu commences par le stage initial."
    n: "1"
    titre: "Stage initial"
    duree: "35 h"
    resume: "35 h pour poser les bases, organisées par ta région."
    points:
      - "35 heures, sur un mois et demi maximum"
      - "Organisé par la CTR (ou délégué à un comité départemental)"
      - "Majoritairement en présentiel, visio limitée à 1/3 du volume horaire"
      - "Présence obligatoire sur la totalité du stage"
      - "Contenu : cadre réglementaire, acte d’enseignement (concevoir, réaliser, évaluer), organisation de l’activité et d’un cursus"
      - "À la fin, tu reçois ton **livret pédagogique**"
      - "Au moins 30 jours pleins entre la fin du stage initial et le début du stage final"
  - id: capitalisation
    filiere: "Filière par capitalisation"
    pour: "Pour les titulaires du GP-N4 de la FFESSM (uniquement), de l’Initiateur FFESSM (quelle que soit son ancienneté) et du module complémentaire 6-20 m acquis depuis moins de 3 ans, ou du BPJEPS. Le stage initial est remplacé par le module complémentaire 20-40 m. Tu peux aussi choisir la filière classique."
    n: "1"
    titre: "Module complémentaire 20-40 m"
    duree: "7 h"
    resume: "7 h de théorie qui remplacent le stage initial."
    points:
      - "7 heures de formation théorique, sur 2 semaines maximum"
      - "100 % en présentiel"
      - "Possibilité de 2 plongées supplémentaires entre 30 et 40 m (en milieu naturel)"
      - "Objectif : compléments méthodologiques pour enseigner à tous niveaux et organiser la plongée entre 20 et 40 m"

# En parallèle du cursus
capacitaire:
  titre: "Module capacitaire"
  resume: "Les connaissances théoriques, à valider avant le stage final."
  essentiel: "Accessible dès le GP-N4. À valider **avant le stage final**."
  points:
    - "Accessible dès l’obtention du GP-N4 (17 ans révolus, licence FFESSM)"
    - "Quatre écrits de 45 minutes maximum chacun : cadre réglementaire (coef. 2), aspects théoriques de l’activité (coef. 2), anatomie, physiologie, physiopathologie (coef. 4), désaturation (coef. 3)"
    - "Acquis si : au moins 10/20 en cadre réglementaire, et 10/20 de moyenne sur les trois autres matières"
    - "Valable 4 ans"
    - "Cas particulier : si tu as obtenu ton GP-N4 (FFESSM ou ANMP) **avant le 01/01/2026**, tu passes uniquement l’épreuve de cadre réglementaire (10/20 minimum). Ta CTR peut l’organiser avant l’examen, et au plus tard pendant un examen."
  lien: { texte: "Réviser le capacitaire", url: "/capacitaire/" }

# Tronc commun
etapes:
  - n: "2"
    titre: "Stage pédagogique en situation"
    resume: "Le cœur de la formation : enseigner pour de vrai, avec ton tuteur."
    points:
      - "Dans un club ou une structure habilitée, avec un **tuteur de stage** (moniteur de niveau E4) qui valide tes séances et tes modules sur le livret pédagogique"
      - "7 modules à valider. Enseignement pratique : 0-6 m, 6-20 m, 20-40 m. Enseignement théorique : niveaux 1 et 2 ; niveaux 3, GP-N4 et DP-N5. Organisation : organiser et sécuriser l’activité ; organiser un cursus de formation."
      - "Pour chaque module : au moins **5 séances complètes, dont 2 validées**, sur des thèmes et des niveaux différents. Une séance est complète quand les trois phases (concevoir, réaliser, évaluer) sont faites, validée quand les trois sont acquises."
      - "Les séances 6-20 m et 20-40 m se font en milieu naturel (pas en fosse). Au-delà de 20 m, le tuteur est obligatoirement dans ta palanquée."
      - "Pendant ce stage, tu as le statut d’**enseignant E2** : tu peux enseigner entre 0 et 20 m sous la responsabilité d’un DP E3, mais tu ne peux pas délivrer de compétences N1/N2, signer de carnets ni être Directeur de Plongée."
      - "Conseil du MFT : participer à un examen complet de GP-N4."
    allegements:
      titre: "Tu as déjà l’Initiateur ou le DP-N5 ?"
      colonnes: ["Tu as (en plus du GP-N4 FFESSM)", "Module « Enseigner 0-6 m »", "Module « Organiser l’activité »"]
      lignes:
        - ["DP-N5", "Obligatoire", "Dispensé"]
        - ["Initiateur", "Dispensé", "Obligatoire"]
        - ["Initiateur + DP-N5", "Dispensé", "Dispensé"]
      mention: "Les titulaires du BPJEPS et certains stagiaires DEJEPS bénéficient d’autres allègements (voir le MFT). Les demandes se font auprès du Président de la CTR avec justificatifs."
    liens:
      - { texte: "Préparer une séance", url: "/s-entrainer/" }
      - { texte: "Construire une progression", url: "/progression/" }
  - n: "3"
    titre: "Stage final"
    duree: "35 h"
    resume: "35 h pour te préparer aux épreuves."
    points:
      - "35 heures, sur 3 week-ends consécutifs maximum, 100 % en présentiel"
      - "Pour y entrer : tous les modules du stage en situation validés + module capacitaire acquis"
      - "Contenu : enseignement dans l’espace 0-40 m et préparation aux épreuves (chacune réalisée au moins une fois pendant le stage)"
  - n: "4"
    titre: "Examen"
    resume: "Quatre épreuves, organisées par ta région."
    examen: true
    points:
      - "Pour être reçu : au moins 150 points, aucune note sous 5/20, toutes les épreuves passées, et 10/20 de moyenne à la fois sur les trois pédagogies et sur l’intervention à 25 m"
      - "À apporter : l’**attestation d’aptitude à l’intervention à 25 m**, signée sur ton livret par un moniteur MF1 (E3) au minimum et valable 9 mois, et ton permis bateau"
    liens:
      - { texte: "Tout savoir sur les épreuves", url: "/examen/" }

# Les quatre épreuves (frise : version courte ; page Examen : cartes détaillées)
epreuves:
  - n: 1
    titre: "Pédagogie pratique"
    court: "une séance dans l’eau"
    coef: 4
    texte: "Une séance dans l’eau, du débutant au DP-N5 et en Randosub."
    duree: "30 min + 30 min"
    url: "/s-entrainer/?epreuve=prat"
  - n: 2
    titre: "Pédagogie organisationnelle"
    court: "bateau, palanquées, sécurité, secours ou cursus de formation"
    coef: 3
    texte: "Bateau, palanquées, sécurité, secours ou cursus de formation."
    duree: "30 min + 10 min + 20 min"
    url: "/s-entrainer/?epreuve=orga"
  - n: 3
    titre: "Pédagogie théorique"
    court: "un cours en salle"
    coef: 4
    texte: "Un cours en salle, du débutant au candidat GP-N4."
    duree: "30 min + 30 min"
    url: "/s-entrainer/?epreuve=theo"
  - n: 4
    titre: "Intervention sur un plongeur en difficulté à 25 m"
    court: ""
    coef: 4
    texte: "Vitesse maîtrisée au plus tard à 20 m, arrêt franc entre 8 et 6 m, parachute."
    duree: "Déroulement et grille de notation"
    url: "/ipd-25-m/"

# Critères de réussite (page Examen : écrits une seule fois)
reussite:
  - "Au moins 150 points au total"
  - "Aucune note sous 5/20"
  - "Toutes les épreuves réalisées (une épreuve non faite est éliminatoire)"
  - "10/20 de moyenne à la fois sur l’ensemble des trois pédagogies et sur l’intervention à 25 m"
reussite_note: "Le MFT non annoté est autorisé pour préparer les trois pédagogies."

# Bandeau de fin de frise
delais:
  - chiffre: "3 ans"
    legende: "maximum entre la fin du stage initial et l’examen (prolongeable d’un an à titre exceptionnel par la CTR)"
  - chiffre: "30 jours"
    legende: "minimum entre stage initial et stage final, et avant de repasser l’examen après un échec"
  - chiffre: "4 ans"
    legende: "de validité pour le module capacitaire"
