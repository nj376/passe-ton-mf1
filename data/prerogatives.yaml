# Prérogatives de chaque niveau, recopiées mot pour mot des MFT du dépôt (_MFT/04 et 05, RIFAP : _MFT/07).
# Affichées en tête de chaque niveau de la page Pistes (encadré replié sur deux lignes).
# Clé : identifiant de l'onglet (data/onglets.yaml). Blocs : « p » paragraphe, « liste » puces, « sous » intertitre.
# Les apostrophes droites sont converties à l'affichage.
PE12:
  titre: "Prérogatives"
  source: "MFT Qualification PE12, version mai 2024"
  blocs:
    - liste:
        - "Le plongeur titulaire de la qualification PE12 est capable de réaliser des plongées d’exploration jusqu’à 12 m de profondeur, au sein d’une palanquée, avec un guide de palanquée (GP) qui prend en charge la conduite de la plongée. Ces plongées sont réalisées dans le cadre d’une organisation sécurisée, mise en place par un directeur de plongée (DP), selon les règles définies par le Code du Sport (CdS)."
        - "Le PE12 offre l’opportunité de s’initier aux activités de plongée en scaphandre de la FFESSM."
        - "Il permet de donner goût aux activités de plongée en scaphandre de manière ludique, sans licence ni visite médicale préalable, avec pour objectif le plaisir des sensations et de la découverte."
        - "Il offre la possibilité de découvrir le milieu naturel avant de s’engager dans un cursus de formation conditionné par la délivrance de la licence sportive."
N1:
  titre: "Prérogatives"
  source: "MFT Plongeur Niveau 1, version décembre 2025"
  blocs:
    - p: "Le plongeur niveau 1 (N1) est capable de réaliser des plongées d’exploration jusqu’à 20 m de profondeur, au sein d’une palanquée, avec un guide de palanquée (GP) qui prend en charge la conduite de la plongée."
    - p: "Ces plongées sont réalisées dans le cadre d’une organisation sécurisée, mise en place par un directeur de plongée (DP), selon les règles définies par le Code du Sport (CdS)."
PA12:
  titre: "Prérogatives"
  source: "MFT Qualification PA12, version mai 2026"
  blocs:
    - p: "Le plongeur titulaire de la qualification Plongeur Autonome 12 m (PA12) est capable de réaliser des plongées d’exploration jusqu’à 12 m de profondeur, au sein d’une palanquée, en autonomie, sans guide de palanquée (GP), avec un ou deux équipiers ayant au minimum les mêmes compétences."
    - p: "A partir de 16 ans, les plongeurs justifiant des aptitudes PA12 sont, sur décision du directeur de plongée (DP), autorisés à évoluer en autonomie dans l’espace 0-12 m aux conditions suivantes :"
    - liste:
        - "Présenter une autorisation éclairée du responsable légal pour cette pratique en autonomie"
        - "Effectuer une information aux membres de la palanquée de la présence d’un mineur."
    - p: "Ces plongées sont réalisées dans le cadre d’une organisation sécurisée, mise en place par un directeur de plongée (DP), présent sur le site qui donne les consignes relatives au déroulement de la plongée selon les règles définies par le Code du Sport (CdS)."
N2:
  titre: "Prérogatives"
  source: "MFT Plongeur Niveau 2, version mai 2026"
  blocs:
    - sous: "PE40"
    - p: "Le plongeur encadré à 40 m (PE40) est capable de réaliser des plongées d’exploration jusqu’à 40 m de profondeur, au sein d’une palanquée, avec un Guide de Palanquée (GP) qui prend en charge la conduite de la plongée."
    - p: "A partir de 14 ans, les plongeurs justifiant des aptitudes PE40 sont, sur décision du directeur de plongée (DP), autorisés à évoluer dans l’espace 0-40 m."
    - p: "Pour les plongeurs âgés de moins de 16 ans, les conditions suivantes doivent être respectées :"
    - liste:
        - "Réaliser des plongées sans palier obligatoire avec le moyen de désaturation utilisé"
        - "Se limiter à deux plongées par jour en respectant un intervalle minimum de trois heures entre ces deux plongées"
        - "La seconde plongée est limitée à 20 m si la première a dépassé 30 m"
    - sous: "PA20"
    - p: "Le plongeur autonome à 20 m (PA20) est capable de réaliser des plongées d’exploration jusqu’à 20 m, au sein d’une palanquée en autonomie, avec un ou deux équipiers ayant au minimum les mêmes compétences."
    - p: "A partir de 16 ans, les plongeurs justifiant des aptitudes PA20 sont, sur décision du directeur de plongée (DP), autorisés à évoluer en autonomie dans l’espace 0-20 m aux conditions suivantes :"
    - liste:
        - "Présenter une autorisation éclairée du responsable légal pour cette pratique en autonomie"
        - "Informer les membres de la palanquée de la présence d’un mineur"
    - p: "Ces plongées sont réalisées dans le cadre d’une organisation sécurisée, mise en place par un directeur de plongée (DP), présent sur le site qui donne les consignes relatives au déroulement de la plongée selon les règles définies par le Code du Sport (CdS)."
N3:
  titre: "Prérogatives"
  source: "MFT Plongeur Niveau 3, version décembre 2025"
  blocs:
    - sous: "PE60"
    - p: "Le plongeur encadré à 60 m (PE60) peut effectuer des plongées jusqu’à 60 m de profondeur, sous la responsabilité d’un directeur de plongée (DP), au sein d’une palanquée encadrée par un E4 minimum pour des évolutions entre 40 et 60 m."
    - sous: "PA40"
    - p: "Le plongeur autonome à 40 m (PA40) peut effectuer des plongées en autonomie jusqu’à 40 m au sein d’une palanquée avec un ou deux équipiers ayant au minimum les mêmes compétences et sous la responsabilité d’un directeur de plongée (DP)."
    - p: "A partir de 17 ans, les plongeurs justifiant des aptitudes PA40 sont, sur décision du directeur de plongée (DP) autorisés à évoluer en autonomie dans l’espace 0-40 m aux conditions suivantes :"
    - liste:
        - "Présenter une autorisation éclairée du responsable légal pour cette pratique en autonomie"
        - "Informer les membres de la palanquée de la présence d’un mineur"
    - sous: "PA60 (Niveau 3)"
    - p: "Le plongeur autonome à 60 m (PA60-Niveau 3) peut effectuer des plongées en autonomie sans directeur de plongée (DP) jusqu’à 40 m dans les conditions identiques au PA40 et jusqu’à 60 m en présence d’un directeur de plongée (DP)."
    - p: "En outre, la carte CMAS 3* de la FFESSM qui lui est délivrée offre des prérogatives plus importantes hors des frontières françaises, en fonction des législations et règlementations locales. Toutefois, lorsqu’il s’agit d’accompagner des groupes organisés français qui conditionnent l’éventualité de l’application du Code du Sport, y compris à l’étranger, le niveau 3 français ne saurait alors être reconnu au titre de guide de palanquée (GP)."
    - p: "Le brevet de niveau 3 (N3) est le niveau de plongeur minimum requis pour accéder au brevet de guide de palanquée (GP-N4)."
N4:
  titre: "Prérogatives"
  source: "MFT Niveau 4 - Guide de palanquée, version mai 2026"
  blocs:
    - p: "Le brevet de « Guide de Palanquée ― Niveau 4 » (GP-N4) de la FFESSM atteste de la maîtrise des compétences requises pour exercer la fonction de guide de palanquée en exploration définie par le Code du Sport (établissements organisant la pratique de la plongée subaquatique Art. A.322-71 à A.322-101 et ses annexes, notamment l’annexe III-15b de la sous-section 1)."
    - p: "Cet encadrant possède les compétences générales suivantes :"
    - liste:
        - "« Accueillir les plongeurs »"
        - "« Participer à l’organisation et à la sécurisation de l’activité »"
        - "« Guider une palanquée en exploration »"
        - "« Respecter l’environnement »"
        - "« Connaissances théoriques »"
    - p: "En plus des prérogatives règlementaires définies par le Code du Sport, le GP-N4 peut :"
    - liste:
        - "Après obtention du diplôme d’initiateur ou déclaration de stage pédagogique dans le cadre du cursus de formation MF1, exercer la fonction d’enseignant niveau 2 (E2) définie dans l’annexe III-15 b de la sous-section 1 du Code du Sport"
        - "Après obtention de la qualification de « directeur de plongée en exploration » (DP-N5), exercer la fonction de directeur de plongée définie dans l’annexe III-15 a de la sous-section 1 du Code du Sport."
    - p: "Le guide de palanquée (GP-N4) de la FFESSM peut signer les plongées d’exploration qu’il a encadrées. En revanche ces plongées ne pourront pas être prises en compte comme prérequis pour l’entrée en formation des diplômes d’état (elles doivent être validées par un E3 minimum)."
    - p: "Les prérogatives d’encadrement attachées à ce brevet restent conditionnées à l’âge du plongeur qui doit avoir au moins 18 ans (dans l’attente de la décision de la Direction des Sports)."
N5:
  titre: "Prérogatives"
  source: "MFT Niveau 5 - Directeur de plongée en exploration, version mai 2026"
  blocs:
    - p: "Le brevet de « niveau 5 - directeur de plongée en exploration » de la FFESSM atteste de la maîtrise des compétences requises pour exercer la fonction de directeur de plongée en exploration définie dans le Code du Sport (Établissements organisant la pratique de la plongée subaquatique Art. A.322-71 à A. 322-101 et ses annexes notamment l’annexe III-15a de la sous-section 1)."
    - p: "Ces prérogatives s’exercent sous la responsabilité du Président du club dans lequel se déroule l’activité."
    - p: "Le niveau 5 - directeur de plongée en exploration peut valider les plongées effectuées par les plongeurs présents sur le site."
    - p: "La validation de ces plongées n’est pas prise en compte dans le nombre de plongées minimum requis pour l’accès aux diplômes d’état (signature par un E3 au minimum)."
RIFAP:
  titre: "Conditions de candidature"
  source: "MFT RIFA Plongée, version mai 2026"
  blocs:
    - liste:
        - "Etre âgé de 12 ans au moins à la date d'entrée en formation et de délivrance de la certification."
        - "Etre titulaire de la licence fédérale en cours de validité."
        - "Présenter un certificat d’absence de contre-indication à la plongée conforme à la réglementation fédérale en vigueur, se référer au chapitre « généralités » du manuel de formation."
        - "Les candidats de moins de 18 ans doivent présenter une autorisation écrite du responsable légal."
